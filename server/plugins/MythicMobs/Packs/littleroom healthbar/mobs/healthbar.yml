#########################################################





HEALTHBAR_GLOBAL_LISTENER:
  Type: MARKER
  Display: 'HEALTHBAR_GLOBAL_LISTENER'
  Options:
    Collidable: false
    Despawn: PERSISTENT
  # Note (2026-09-22): the pack's own skills/healthbar.yml never actually defines
  # HEALTHBAR_GLOBAL_reset_player_vars (checked — it's not in that file at all), so
  # this line threw "Could not find MetaSkill" on every ~onTimer:20 tick — removed.
  # It was a maintenance/cleanup skill per the pack's readme, not core functionality.
  Skills:
  - skill{s=HEALTHBAR_GLOBAL_init} @self ~onSpawn
  - skill{s=HEALTHBAR_GLOBAL_check_entity_health;sync=true} @EIW ~onTimer:5



HEALTHBAR_ENTITY:
  Display: 'TESTING'
  Type: text_display
  Options:
    Collidable: false
    Despawn: PERSISTENT
  Variables:
    hide_bar_on_sneak: string/true            
    hide_bar_on_sneak_opacity: integer/128    # 255 is max opacity
    show_entity_name: string/true             # show entity nametag above the healthbar
    display_level_on_health_bar: string/true  # show entity level next to the nametag
    player_level_placeholder: string/false    # if you want to use a plugin that handles player levels place it here for ex. set it to %mmocore_level% if you use mmocore
    show_status_effects: string/true          # show potion icons under the healthbar
    show_damage_numbers: string/true          # spawn numbers when taking damage
    hide_timeout_length: integer/10           # how long before the healthbar times out
    vertical_offset: float/2.0                # bar height above the mob's FEET (2026-09-22 round 4: redefined from a small eye-location offset to a full feet-based height, since the bar is now teleport-tracked instead of mounted — see skills/healthbar.yml)
  DisplayOptions:
    ViewRange: 0.5                            # 0.5 is 32 blocks
    Text: "HEALTHBAR_ENTITY"
    BlockLight: 15
    SkyLight: 15
    Billboard: CENTER
    Scale: 0,0,0
    Translation: 0,0.0,0
    InterpolationDuration: 1
    BackgroundColor: 0
    Shadowed: true
    Alignment: CENTER
  Skills:
  - displaytransformation{action=set;transformation=SCALE;value=1,1,1;delay=2} @self ~onSpawn
  - skill{s=HEALTHBAR_ENTITY_init} @self ~onSpawn
  # Note (2026-09-22, round 4): live testing showed the bar never actually
  # tracked a moving mob, even after adding a periodic re-mount the same day
  # (see git history) — the vehicle-mount approach (mountme) never reliably
  # worked here. HEALTHBAR_ENTITY_determine_status now includes a repeating
  # teleportto that reads the mob's live location every 2 ticks instead;
  # positioning no longer depends on Bukkit vehicle/passenger mechanics at all.
  - skill{s=HEALTHBAR_ENTITY_determine_status} @parent ~onTimer:2
  - skill{s=HEALTHBAR_ENTITY_detect_sneak} @parent ~onTimer:10
  - remove @self ~onTimer:1 ?!isparentalive

  


HEALTHBAR_ENTITY_damage_number: 
  Type: text_display
  Options:
    Collidable: false
    Despawn: PERSISTENT
  DisplayOptions:
    ViewRange: 0.5                            # 0.5 is 32 blocks
    Text: "damagenumber"
    BlockLight: 15
    SkyLight: 15
    Billboard: CENTER
    Scale: 0,0,0
    Translation: 0,0,0
    InterpolationDuration: 2
    BackgroundColor: 0
    Shadowed: true
    Alignment: CENTER
  Skills:
  - displaytransformation{action=set;transformation=SCALE;value=2,2,2;delay=2} @self ~onSpawn
  - displaytransformation{action=set;transformation=SCALE;value=0,0,0;delay=15} @self ~onSpawn
  - mount{type=HEALTHBAR_ENTITY_damage_number_stand} @self ~onSpawn
  - remove{delay=20} @self ~onSpawn
  
HEALTHBAR_ENTITY_damage_number_stand:
  Type: ARMOR_STAND
  Options:
    Collidable: false
    PreventOtherDrops: true
    Silent: true
    Interactable: false
    Invincible: true
    NoAI: true
    Small: true
    HasBasePlate: false
    Invisible: true
  Skills:
  - velocity{x=<random.float.-0.2to0.2>;y=<random.float.0.4to0.6>;z=<random.float.-0.2to0.2>} @self ~onSpawn
  - remove{delay=20} @self ~onSpawn
