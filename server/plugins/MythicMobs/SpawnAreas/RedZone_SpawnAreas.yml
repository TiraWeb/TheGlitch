# The Glitch — MythicMobs Spawn Areas for glitch_red (The Red Zone)
# Zone distribution per GAME_DESIGN §2 and ZONES.md:
#   T1 fodder roams everywhere (common)
#   T2 standard mobs occupy mid zones (the cross ring between entries and core)
#   T3 elites guard points of interest (Core 0,0 + extraction beacons X1/X2/X3)
#   T4 bosses spawn as scheduled server events — no spawn areas.
#
# Border is 2000 (half-width 1000) centered on 0,0. Y spans the full world
# height; MythicMobs picks surface positions inside each cuboid.
# Weights are relative; lv=1 until class/gear scaling lands.
#
# Density tuning 2026-08-24 (RED WORLD only) — sparse but visible:
#   World 2000x2000 => ~15625 chunks. Naive 1 per 5-10 = 1562-3125 concurrent (TPS death).
#   Previous 2026-08-23: 61 concurrent (~1/256 chunks) was too sparse — players reported
#   "no mobs at all" due to high Cooldown 90-300s + low Limits. New target ~90-110 concurrent
#   (~1/140-170 chunks) with faster 45-90s cooldowns so roaming feels populated without
#   TPS spike. Vanilla spawns disabled via spawn_mobs false (blocks NATURAL only; MythicMobs TYPE:WORLD bypasses it).
#   If mobs still absent, check: /gamerule spawn_mobs (should be false), /rg flag -w glitch_red __global__ mob-spawning (should be unset/allow), and MythicMobs config Spawning.PluginsRespectGamerule=false.

# --- T1: fodder everywhere (4 quadrants, core + ring excluded) --------------

RZ_T1_NorthWest:
  Type: WORLD
  World: glitch_red
  Area: CUBOID
  Min: '-1000,-64,-1000'
  Max: '-301,320,-301'
  SpawnLimit: 8
  SpawnCooldown: 45
  Mobs:
