# The Glitch — MythicMobs Spawn Areas for glitch_red (The Red Zone)
# Zone distribution per GAME_DESIGN §2 and ZONES.md:
#   T1 fodder roams everywhere (common)
#   T2 standard mobs occupy mid zones (the cross ring between entries and core)
#   T3 elites guard points of interest (Core 0,0 + extraction beacons X1/X2/X3)
#   T4 bosses spawn as scheduled server events — no spawn areas.
#
# Border is 2000 (half-width 1000) centered on 0,0. Y spans the full world
# height; MythicMobs picks surface positions inside each cuboid.
# Weights are relative; lv=1 until class/gear scaling lands.
#
# Density tuning (RED WORLD only) — sparse, performant adventure:
#   World 2000x2000 @ border 2000 => ~15625 chunks (125*125).
#   At 1 mob per 5-10 chunks naive calc = 1562-3125 concurrent mobs (too many for TPS).
#   Tuned target ~1 per ~200-250 chunks (~60-80 concurrent across all 13 areas) for
#   sparse exploration: T1 quadrants 6/90, T2 cross-ring 5/60, Core mixed 8/60,
#   Core elite 3/300, Beacons 2/300. MythicMobs SpawnLimit is concurrent cap per
#   cuboid; Cooldown seconds throttles respawn rate. Previous 25/5 was far too dense
#   (100 T1 + 40 T2 = lag spike on entry). 4-6 per large cuboid + 60-120s cooldown
#   gives breathing room while keeping threat.
#   Vanilla spawns disabled via spawn_mobs false (gamerule) so only these MythicMobs spawn.

# --- T1: fodder everywhere (4 quadrants, core + ring excluded) --------------

RZ_T1_NorthWest:
  Type: WORLD
  World: glitch_red
  Area: CUBOID
  Min: '-1000,-64,-1000'
  Max: '-301,320,-301'
  SpawnLimit: 6
  SpawnCooldown: 90
  Mobs:
  - GlitchWisp{lv=1} @0.6
  - CorruptedCrawler{lv=1} @0.4

