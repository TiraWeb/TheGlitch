# The Glitch — MythicMobs: Glitch Phantom (Tier 2 ranged)
# Custom model 2026-09-21: "mage" rig (Beyond Mob Pack), partial-adopt —
# keeps Phantom's native PHANTOM Type/fly-float-randomfly AI (flight is core
# to its identity) and only layers the mage's model + animated burst-attack
# on top, rather than becoming a grounded SKELETON caster like the source mob.
# Resonates Veil.
# Design: GAME_DESIGN §2 (T2), Resonance: ITEM_SYSTEM §5.

GlitchPhantom:
  Type: PHANTOM
  Display: '<light_purple>Glitch Phantom'
  Health: 40
  Damage: 8
  HealthBar:
    Enabled: true
    Offset: 1.0
  Options:
    MovementSpeed: 0.35
    Silent: true
    AlwaysShowName: true
    Persistent: false
    Despawn: true
    FollowRange: 30
    KnockbackResistance: 0
    PreventBlockDestruction: true
    ScoreboardTags: [res_veil]
  AIGoalSelectors:
    - clear
    - fly
    - float
    - lookatplayers
    - randomfly
  AITargetSelectors:
    - clear
    - players
  Skills:
    - model{mid=mage;usm=true;n=false;step=1} @self ~onSpawn
    - model{mid=mage;usm=true;n=false;step=1} @self ~onLoad
    - effect:sound{s=entity.phantom.ambient;v=0.5;p=1.2} @self ~onSpawn 1
    - effect:sound{s=entity.phantom.hurt;v=0.7;p=0.9} @self ~onDamaged 0.4
    - effect:sound{s=entity.phantom.death;v=1;p=0.6} @self ~onDeath 1
    - skill{s=GlitchPhantom_Hit} @self ~onDamaged 0.4
    - skill{s=GlitchPhantom_Attack} @target ~onTimer:60 0.5
  Drops:
    - GlitchPhantomLoot
