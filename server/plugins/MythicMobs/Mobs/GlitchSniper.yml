# The Glitch — MythicMobs: Glitch Sniper (Tier 3 elite)
# Custom model 2026-09-21: "voids_wizard" rig (the_voids pack), full-adopt —
# a kiting corrupted wizard with a pull+AOE+nausea burst, was a Skeleton
# archer. Kites away instead of standing and firing. Resonates Ward.
# Design: GAME_DESIGN §2 (T3), Resonance: ITEM_SYSTEM §5.

GlitchSniper:
  Type: ZOMBIE
  Display: '<dark_red>Glitch Sniper'
  Health: 80
  Damage: 8
  AIGoalSelectors:
    - clear
    - fleeplayers{d=4;s=1.5;ss=1.5}
    - lookAtTarget{r=24;speed=2}
    - zombieAttack
  AITargetSelectors:
    - clear
    - players
  Options:
    MovementSpeed: 0.3
    Silent: true
    AlwaysShowName: true
    Persistent: false
    Despawn: true
    FollowRange: 40
    KnockbackResistance: 0.5
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventSunburn: true
    PreventRandomEquipment: true
    PreventJockeyMounts: true
    PreventBlockDestruction: true
    ScoreboardTags: [res_ward]
  Skills:
    - model{mid=voids_wizard;h=true} @self ~onSpawn
    - model{mid=voids_wizard;h=true} @self ~onLoad
    - skill{s=GlitchSniper_Attack} @self ~onTimer:20 ?!moving ?targetinlineofsight ?playerwithin{d=16} ?!playerwithin{d=6}
    - skill{s=GlitchSniper_Walk} @self ~onTimer:20 ?moving
    - effect:sound{s=entity.witch.celebrate;v=0.85;p=0.8} @self ~onTimer:150 0.4
    - effect:sound{s=entity.strider.hurt;v=0.85;p=2} @self ~onDamaged 0.4
    - effect:sound{s=entity.strider.death;v=0.85;p=2.3} @self ~onDeath 1
  Drops:
    - GlitchSniperLoot
