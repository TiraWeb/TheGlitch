# The Glitch — MythicMobs: Glitch Sentinel (Tier 3 elite)
# Custom model 2026-09-21: "ender_watchman" rig (EndMobsVol1 pack), full-adopt —
# a corrupted watchman with a lantern-smack/summon-wraiths/lantern-push kit,
# was a Wither Skeleton. Its summon-wraiths mechanic is the drop-in
# replacement for the old "summons 2 Wisps every 30s". Resonates Ward.
# Design: GAME_DESIGN §2 (T3), Resonance: ITEM_SYSTEM §5.

GlitchSentinel:
  Type: VINDICATOR
  Display: '<red>Glitch Sentinel'
  Health: 150
  Damage: 12
  Faction: GLITCH
  DamageModifiers:
    - SUFFOCATION 0
    - FALL 0
  AIGoalSelectors:
    - clear
    - meleeattack
    - movetowardstarget
    - randomstroll
  AITargetSelectors:
    - clear
    - attacker
    - players
  Options:
    NoDamageTicks: 10
    MovementSpeed: 0.28
    FollowRange: 24
    KnockbackResistance: 1
    Silent: true
    Persistent: false
    Despawn: true
    Invincible: false
    PreventSunburn: true
    PreventBlockInfection: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventJockeyMounts: true
    PreventBlockDestruction: true
    MaxCombatDistance: 24
    ScoreboardTags: [res_ward]
    ShowHealth: true
  Skills:
    - skill{s=CancelEvent} @self ~onAttack
    - model{mid=ender_watchman;usm=true} @self ~onSpawn
    - model{mid=ender_watchman;usm=true} @self ~onLoad
    - randomskill{skills=GlitchSentinel_LanternSmack,GlitchSentinel_SummonWraiths,GlitchSentinel_LanternPush} @self ~onTimer:20
    - skill{s=GlitchSentinel_AggroSound} @self ~onTimer:1000
    - effect:sound{s=entity.wither_skeleton.hurt;v=0.7;p=0.9} @self ~onDamaged 0.3
    - effect:sound{s=entity.wither_skeleton.death;v=1;p=0.7} @self ~onDeath 1
  Drops:
    - GlitchSentinelLoot
