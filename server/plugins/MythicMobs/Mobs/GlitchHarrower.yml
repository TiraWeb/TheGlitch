# The Glitch — MythicMobs: Glitch Harrower (Tier 3 elite, new 2026-09-21)
# Custom model: "voids_mask" rig (the_voids pack) — a corrupted ambusher that
# stuns, throws up an expanding portal ring, then knocks the target back with
# a heavy throw + slow. Resonates Veil.
# Design: GAME_DESIGN §2 (T3, new), Resonance: ITEM_SYSTEM §5.

GlitchHarrower:
  Type: ZOMBIE
  Health: 95
  Damage: 10
  Display: '<dark_purple>Glitch Harrower'
  AITargetSelectors:
    - clear
    - players
  Options:
    MovementSpeed: 0.25
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventSunburn: true
    PreventRandomEquipment: true
    PreventJockeyMounts: true
    PreventBlockDestruction: true
    FollowRange: 32
    Silent: true
    Jockey: false
    KnockbackResistance: 0.65
    ScoreboardTags: [res_veil]
  Skills:
    - model{mid=voids_mask;h=true} @self ~onSpawn
    - model{mid=voids_mask;h=true} @self ~onLoad
    - skill{s=GlitchHarrower_Attack} ~onAttack
    - effect:sound{s=entity.zombie_villager.step;v=0.25;p=0.45} @self ~onTimer:20 ?moving
    - e:particles{p=Spell_mob;color=#FB0AF6;speed=1;a=10;size=1.5;hs=0.5;vs=2} @self ~onTimer:60
    - e:particles{particle=falling_dust;m=PINK_CONCRETE;a=4;hS=0.5;vS=1.5} @self ~onDamaged 0.5
    - effect:sound{s=entity.strider.hurt;v=0.85;p=1.3} @self ~onDamaged 0.4
    - effect:sound{s=entity.strider.retreat;v=0.85;p=0.8} @self ~onTimer:150 0.4
    - e:particles{p=trial_spawner_detection_ominous;speed=0;a=2;size=1.5;hs=0.5;vs=2} @self ~onDeath
    - effect:sound{s=entity.strider.death;v=0.85;p=1.3} @self ~onDeath 1
    - effect:sound{s=entity.armadillo.unroll_start;v=1;p=0.9} @self ~onDeath 1
  Drops:
    - GlitchHarrowerLoot
