# The Glitch — MythicMobs Random Spawns for glitch_red (2026-08-24 fix)
# Replaces the old SpawnAreas/RedZone_SpawnAreas.yml which used Type:WORLD (not loaded by Mythic 5.13).
# This file uses the correct RandomSpawns ADD system (requires GenerateSpawnPoints:true in config-spawning.yml).
# Each entry spawns in glitch_red with a Chance per spawn point. Points are generated around survival players
# within SpawnRadiusPerPlayer (64). Cooldown throttles per-entry.
# Density target: ~90-110 concurrent (~1/150 chunks) with 4 tiers.

# --- T1 fodder: spawns everywhere, most common — 2026-08-24: 0.25/30 was too
# dense (150/min); 0.06/60 turned out too sparse (operator: "rarely see a mob,
# sometimes only at spawn" — SpawnRadiusPerPlayer is only 64, so a low Chance
# per point-check compounds into long dry stretches while exploring). 2026-09-21:
# split the difference, still well under the original "too dense" values.
RZ_T1_Wisp_Crawler:
  Action: ADD
  Types:
  - GlitchWisp 60
  - CorruptedCrawler 40
  Worlds: glitch_red,glitch_red_eleria,glitch_red_horizons
  Chance: 0.10
  Priority: 1
  PositionType: LAND
  Cooldown: 45

# --- T2 mid-tier: cross-ring and general — was 0.18/45 too dense, 0.04/90 too sparse ---
RZ_T2_Stalker_Brute_Phantom:
  Action: ADD
  Types:
  - GlitchStalker 45
  - GlitchBrute 30
  - GlitchPhantom 25
  Worlds: glitch_red,glitch_red_eleria,glitch_red_horizons
  Chance: 0.07
  Priority: 2
  PositionType: LAND
  Cooldown: 70

# --- T3 elites: Core and beacons (rarer, stronger) — was 0.08/90 too dense, 0.015/180 too sparse ---
# GlitchHarrower (new 2026-09-21) added, weights rebalanced across 4 entries.
RZ_T3_Sentinel_Sniper_Warden:
  Action: ADD
  Types:
  - GlitchSentinel 30
  - GlitchSniper 27
  - GlitchWarden 20
  - GlitchHarrower 23
  Worlds: glitch_red,glitch_red_eleria,glitch_red_horizons
  Chance: 0.025
  Priority: 3
  PositionType: LAND
  Cooldown: 140

# --- T3.5 mini-boss: rare standing threat, not a scheduled server event
# (unlike RZ_T4_Bosses below) — new 2026-09-21 ---
RZ_T35_Reaver:
  Action: ADD
  Types:
  - GlitchReaver 100
  Worlds: glitch_red,glitch_red_eleria,glitch_red_horizons
  Chance: 0.0025
  Priority: 5
  PositionType: LAND
  Cooldown: 600

# --- T4 bosses: REMOVED from open-world random spawn 2026-09-22, per operator
# request — TheGlitchKing (Ender Dragon) had unconditional (non-phase-gated)
# repeating summon skills that kept spawning GlitchStalkers for as long as it
# stayed alive un-killed, which combined with no random-spawn density cap
# (see config-spawning.yml SpawningLimit/LocalSpawningLimit fix, same date)
# to produce the reported "50-100 mobs in one spot." TheGlitchKing's mob file
# and drop table were deleted outright (nothing else references it).
# GlitchCore's mob file (server/plugins/MythicMobs/Mobs/GlitchCore.yml) and
# drop table were KEPT, not deleted — GlitchDungeons' wave-based dungeon boss
# rooms (plugins/GlitchDungeons/src/main/resources/config.yml, 4 dungeons)
# spawn it by type name for their scripted instanced boss fight. It simply no
# longer appears via this open-world random-spawn system.
# --- Legacy note: old SpawnAreas/RedZone_SpawnAreas.yml kept for reference but not loaded by Mythic 5.13.
# If you see "Loaded 0 random spawns" after mm reload, check:
#   /plugins/MythicMobs/config/config-spawning.yml -> RandomSpawning.GenerateSpawnPoints: true
#   and gamerule glitch_red spawn_mobs true (or DisableVanillaSpawns:true to block vanilla)
