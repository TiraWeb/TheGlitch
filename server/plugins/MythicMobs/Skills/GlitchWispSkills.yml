    - targetnotwithin{d=8} true
    - targetwithin{d=10} true
    - hasaura{n=GlitchWispSummoned} false
    - hasaura{n=GlitchWispRightSlash} false
    - hasaura{n=GlitchWispLeftSlash} false
    - hasaura{n=GlitchWispSpinSlash} false
    - hasaura{n=GlitchWispDash} false
  Skills:
    - delay 1
    - CancelEvent @self
    - setspeed{speed=0;type=WALKING} @self
    - aura{auraName=GlitchWispDash;duration=70} @self
    - state{model=end_wraith;state=wraith_dash} @self
    - sound{s=tugkandeman.end_wraith_dash;v=2;p=1} @self
    - delay 10
    - lockmodel @self
    - delay 20
    - projectile{sE=false;syo=0;tyo=0;d=12;v=20;onTick=[ - teleport @ProjectileForward{f=-1.2} ];hnp=true} @forward{f=9}
    - delay 12
    - aura{auraName=GlitchWispDashD;d=5;oT=GlitchWisp_Dash_Damage} @self
    - delay 28
