# The Glitch — MythicMobs Skills: Glitch Wisp
# Ported from EndMobsVol1/skills/end_mobs_skills.yml ("end_wraith"), renamed
# and rescaled from its source ~10 dmg/hit down to Tier 1 fodder (~3 dmg/hit).
# Timings/mechanics kept as-authored (they're synced to the model's animation
# frames) — only Health/Damage numbers were rescaled.

GlitchWisp_Summoned:
  Skills:
    - aura{auraName=GlitchWispSummoned;duration=20} @self
    - setgravity{g=false} @self
    - setNoDamageTicks{ticks=20;delay=1} @self
    - delay 20
    - setgravity{g=true} @self
    - potion{type=SLOW_FALLING;d=20;l=10} @self

GlitchWisp_RightSlash:
  Conditions:
    - incombat true
    - targetwithin{d=3} true
    - hasaura{n=GlitchWispSummoned} false
    - hasaura{n=GlitchWispRightSlash} false
    - hasaura{n=GlitchWispLeftSlash} false
    - hasaura{n=GlitchWispSpinSlash} false
    - hasaura{n=GlitchWispDash} false
  Skills:
    - delay 1
    - CancelEvent @self
    - setspeed{speed=0;type=WALKING} @self
    - aura{auraName=GlitchWispRightSlash;duration=30} @self
    - state{model=end_wraith;state=right_slash} @self
    - sound{s=tugkandeman.end_wraith_rightslash;v=2;p=1} @self
    - delay 8
    - lockmodel @self
    - delay 1
    - aura{auraName=GlitchWispRightSlashD;duration=5;oT=GlitchWisp_RightSlash_Damage} @self
    - delay 21
    - skill{s=Glitch_TeleportAway} @self 0.1
    - lockmodel{l=false} @self
    - setspeed{speed=1;type=WALKING} @self

GlitchWisp_RightSlash_Damage:
  Skills:
    - totem{md=2;oH=[ - damage{a=3} ];hnp=true;hp=true;hR=1.5;vR=1.5;i=1;drawhitbox=false} @ModelPart{mid=end_wraith;pid=hurtbox}

