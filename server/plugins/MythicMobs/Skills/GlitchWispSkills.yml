# Dash — distance-tiered dispatcher (mirrors the source pack's pattern)
GlitchWisp_Dash:
  Conditions:
    - incombat true
    - (targetnotwithin{d=8} && targetwithin{d=10}) CastInstead GlitchWisp_Dash_1
    - (targetnotwithin{d=10} && targetwithin{d=12}) CastInstead GlitchWisp_Dash_2
    - (targetnotwithin{d=12} && targetwithin{d=14}) CastInstead GlitchWisp_Dash_3
    - (targetnotwithin{d=14} && targetwithin{d=16}) CastInstead GlitchWisp_Dash_4
  Skills:
    - CancelEvent @self

GlitchWisp_Dash_Damage:
  Skills:
    - totem{md=2;oH=[ - damage{a=3} ];hnp=true;hp=true;hR=1.5;vR=1.5;i=1;drawhitbox=false} @ModelPart{mid=end_wraith;pid=hurtbox}

GlitchWisp_Dash_1:
