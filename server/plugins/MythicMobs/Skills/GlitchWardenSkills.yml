# The Glitch — MythicMobs Skills: Glitch Warden
# Ported from Beyond Mob Pack 1.0/MythicMobs/packs/Beyond_Mob_Pack/skills/Beyond_Skills.yml
# ("coffin_man"), renamed and rescaled 10->14 dmg per hit to Tier 3 elite.

GlitchWarden_Attack:
  Cooldown: 1.5
  Skills:
    - randomskill{s=GlitchWarden_Attack1,GlitchWarden_Attack2;weights=1,1} @self

GlitchWarden_Attack1:
  Skills:
    - state{s=none;f=true;lerp=false} @self
    - setspeed{speed=0;type=walk} @self
    - state{s=attack1;f=true;lerp=false} @self
    - effect:particles{p=dust_color_transition;color=#111111;toColor=#444444;size=1.6;amount=16;hS=0.42;vS=0.18;y=1.4;s=0.01} @self
    - effect:particles{p=smoke_large;amount=5;hS=0.4;vS=0.2;y=1.2;s=0.01} @self
    - delay 18
    - damage{a=14;pkb=false;hnp=false;hp=true} @target
    - effect:particles{p=dust_color_transition;color=#111111;toColor=#777777;size=1.4;amount=28;hS=0.45;vS=0.35;y=0.7;s=0.01} @target
    - effect:particles{p=smoke_large;amount=5;hS=0.3;vS=0.25;y=0.7;s=0.01} @target
    - effect:particles{p=crit;amount=5;hS=0.22;vS=0.22;y=0.7;s=0.01} @target
    - effect:particles{p=end_rod;amount=3;hS=0.12;vS=0.12;y=0.75;s=0.01} @target
    - delay 14
    - state{s=idle;f=true;lerp=false} @self
    - setspeed{speed=1;type=walk} @self

GlitchWarden_Attack2:
  Skills:
    - state{s=attack2;f=true;lerp=false} @self
    - effect:particles{p=dust_color_transition;color=#111111;toColor=#555555;size=1.5;amount=18;hS=0.40;vS=0.20;y=1.3;s=0.01} @self
    - effect:particles{p=smoke_large;amount=4;hS=0.35;vS=0.18;y=1.1;s=0.01} @self
    - delay 24
    - damage{a=14;pkb=false;hnp=false;hp=true} @target
    - effect:particles{p=dust_color_transition;color=#111111;toColor=#777777;size=1.4;amount=24;hS=0.40;vS=0.30;y=0.8;s=0.01} @target
    - effect:particles{p=smoke_large;amount=5;hS=0.30;vS=0.25;y=0.8;s=0.01} @target
    - effect:particles{p=crit;amount=4;hS=0.22;vS=0.22;y=0.8;s=0.01} @target
    - effect:particles{p=end_rod;amount=2;hS=0.10;vS=0.10;y=0.85;s=0.01} @target

GlitchWarden_Hit:
  Skills:
    - state{s=none;f=true;lerp=false} @self
    - effect:particles{p=dust_color_transition;color=#111111;toColor=#666666;size=1.3;amount=12;hS=0.32;vS=0.32;y=1.2;s=0.01} @self
    - effect:particles{p=smoke_large;amount=4;hS=0.22;vS=0.22;y=1.2;s=0.01} @self
    - effect:particles{p=crit;amount=3;hS=0.18;vS=0.18;y=1.2;s=0.01} @self
    - state{s=hit;f=true;lerp=false} @self
    - delay 8
    - state{s=idle;f=true;lerp=false} @self
