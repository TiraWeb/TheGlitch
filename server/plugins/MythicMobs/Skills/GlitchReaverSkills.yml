# The Glitch — MythicMobs Skills: Glitch Reaver (new mini-boss, T3.5)
# Ported from EndMobsVol1/skills/end_mobs_skills.yml ("endermauler") near-
# verbatim — this is the pack's most polished asset (boss bar, segmented tail
# render, teleport-maul) and is kept close to its source design rather than
# folded into an existing mob slot. Damage kept at the source's own 10/hit
# (it hits many times per combo) with Health set high in the mob file instead.

GlitchReaver_IdleTeleport:
  Conditions:
    - incombat false
    - chance{c=0.3} true
  Skills:
    - CancelEvent @self
    - summon{type=GlitchVoidwake;amount=1} @self
    - partvis{model=endermauler;p=endermauler;v=false;child=true} @self
    - delay 1
    - teleport{r=20;sv=2} @self
    - sound{s=tugkandeman.endermauler_teleport2;v=2;p=1} @self
    - delay 1
    - partvis{model=endermauler;p=endermauler;v=true;child=true} @self

GlitchReaver_RightSlash:
  Cooldown: 8
  Conditions:
    - incombat true
    - targetnotwithin{d=1} true
    - targetwithin{d=6} true
    - hasaura{n=GlitchReaverRightSlash} false
    - hasaura{n=GlitchReaverLeftSlash} false
    - hasaura{n=GlitchReaverDashBiteStartup} false
    - hasaura{n=GlitchReaverDashBite} false
    - hasaura{n=GlitchReaverScream} false
    - hasaura{n=GlitchReaverTeleportMaul} false
    - hasaura{n=GlitchReaverCloseSlashes} false
  Skills:
    - delay 1
    - CancelEvent @self
    - setspeed{speed=0;type=WALKING} @self
    - aura{auraName=GlitchReaverRightSlash;duration=50} @self
    - state{model=endermauler;state=right_slash} @self
    - sound{s=tugkandeman.endermauler_rightslash;v=2;p=1} @self
    - delay 9
    - propel{v=2} @target
    - lockmodel @self
    - delay 3
    - aura{auraName=GlitchReaverRightSlashD;duration=5;oT=GlitchReaver_RightSlash_Damage} @self
    - delay 38
    - skill{s=GlitchReaver_TeleportAway} @self 0.1
    - lockmodel{l=false} @self
    - setspeed{speed=1.5;type=WALKING} @self

GlitchReaver_RightSlash_Damage:
  Skills:
    - totem{md=2;oH=[ - damage{a=10} ];hnp=true;hp=true;hR=1.5;vR=1.5;i=1;drawhitbox=false} @ModelPart{mid=endermauler;pid=hurtbox}

