# The Glitch — custom font glyphs (Arcane Ruins UI kit)
#
# `font: minecraft:default` + `char:` (2026-09-20, migrated from Oraxen).
# **Found the hard way:** without an explicit `font:`, Nexo auto-assigns
# glyphs into its own `nexo:default` font with random internal codepoints,
# ignoring `char:` entirely — every raw \uE0XX literal in Java rendered as a
# tofu box. Pinning `font: minecraft:default` makes Nexo honor `char:` exactly
# like Oraxen did (verified: all 19 codepoints below came back byte-identical
# in the regenerated pack), so every existing Java usage keeps working as-is —
# no code changes needed, just this config. Java side mirrors these codepoints
# in plugins/GlitchItems/.../GlitchUI.java — keep the two in sync. Textures
# come from pack/textures/glyphs/ (scripts/gen-ui-textures.py).
#
# Bedrock/Geyser clients cannot render PUA glyphs — every in-game usage must
# pair the glyph with a plain-text label so Bedrock loses decoration only.

res_aegis:
  texture: glyphs/res_aegis
  ascent: 8
  height: 9
  font: minecraft:default
  char: "\uE040"

res_veil:
  texture: glyphs/res_veil
  ascent: 8
  height: 9
  font: minecraft:default
  char: "\uE041"

