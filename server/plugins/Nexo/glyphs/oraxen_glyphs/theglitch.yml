# The Glitch — custom font glyphs (Arcane Ruins UI kit)
#
# Mapped into minecraft:default by Oraxen's vanilla glyph handler; usable as
# raw unicode chars anywhere text renders (lore, titles, chat). Java side
# mirrors these codepoints in plugins/GlitchItems/.../GlitchUI.java — keep the
# two in sync. Textures come from pack/textures/glyphs/ (scripts/gen-ui-textures.py).
#
# Bedrock/Geyser clients cannot render PUA glyphs — every in-game usage must
# pair the glyph with a plain-text label so Bedrock loses decoration only.

res_aegis:
  texture: glyphs/res_aegis
  ascent: 8
  height: 9
  char: "\uE040"

