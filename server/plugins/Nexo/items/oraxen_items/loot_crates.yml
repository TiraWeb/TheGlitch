# The Glitch — Nexo furniture: custom loot-container crate models, ported from
# the "Loot Models" ItemsAdder elemental-crates pack (models kept byte-identical,
# just renamed and re-namespaced under loot_crates:). Applied to all 4
# ContainerManager types (see GlitchItems config.yml containers.types.*.furniture-id):
# fire_crate -> debris, earth_crate -> cache, water_crate -> vault,
# darkness_crate -> rift_vault.
#
# These are never given to players as items — placement is exclusively via
# NexoFurniture.place() from ContainerManager/ScatterManager, and the furniture
# entity's right-click is intercepted by ContainerFurnitureListener (which denies
# Nexo's own storage GUI and runs our loot-roll logic instead).
loot_crates_fire:
  itemname: "<gray>Debris Crate</gray>"
  material: PAPER
  Pack:
    model: loot_crates:item/fire_crate
  Mechanics:
    furniture:
      limited_placing:
        roof: false
        floor: true
        wall: false
      rotatable: true
      restricted_rotation: NONE
      block_sounds:
        place_sound: block.wood.place
        break_sound: block.wood.break
      hitbox:
        barriers:
        - 0,0,0
