# The Glitch — Mystic Arsenal: 25 curated weapons from the operator-supplied
# "Fantasy Weapons" pack (Skulpt's Fantasy Arsenal, Nexo-native custom 3D
# models under the skulpt: namespace). Sold in GlitchShops' Mystic category
# only — deliberately above the Legendary gear tier: flat +6 ATTACK_DAMAGE,
# +0.5 ATTACK_SPEED, and near-max vanilla enchant stack, priced far above
# even a godroll Legendary (docs/ITEM_BALANCE.md: ~6100 shards) so it reads
# as a genuine prestige/endgame chase purchase, not a routine upgrade.
# See docs/STATUS.md round 11 for the full pick rationale + pricing tiers.

colossal_sword:
  itemname: <gradient:#a855f7:#f472b6><bold>Colossal Sword</bold></gradient>
  material: NETHERITE_SWORD
  Pack:
    generate_model: false
    oversized_in_gui: true
    model: skulpt:arsenals/fantasy_arsenal/colossal_sword
  AttributeModifiers:
    - attribute: ATTACK_DAMAGE
      amount: 6
      operation: ADD_NUMBER
      slot: MAINHAND
    - attribute: ATTACK_SPEED
      amount: 0.5
      operation: ADD_NUMBER
      slot: MAINHAND
  Enchantments:
    sharpness: 7
    fire_aspect: 3
    looting: 4
    sweeping_edge: 3
    knockback: 2
    unbreaking: 5
    mending: 1
  lore:
  - "<gradient:#a855f7:#f472b6>✦ MYSTIC ✦</gradient>"
  - "<dark_gray><italic>A blade too large for mortal hands, yet you wield it anyway.</italic></dark_gray>"
  - ''
  - " <gray>Sell price: <aqua>14000 Shards</aqua></gray>"

