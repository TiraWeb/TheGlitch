# The Glitch — raid party HUD listeners. Slot 1 = party leader (Parties rank
# "leader"), slots 2-4 = the other members (Parties' default "member" rank,
# numbered 1-3) — see partyhud-p.yml header for why this uses the Parties
# plugin's own relational placeholders instead of a GlitchRaid-native one.
member1_health_p:
  value: '%parties_list_rank_leader_1_player_health_rounded%'
  max: '%parties_list_rank_leader_1_player_max_health_rounded%'

member1_residual_p:
  value: '%parties_list_rank_leader_1_glitchitems_stacks%'
  max: '%parties_list_rank_leader_1_glitchitems_max_stacks%'
#############################################################################################
member2_health_p:
  value: '%parties_list_rank_member_1_player_health_rounded%'
  max: '%parties_list_rank_member_1_player_max_health_rounded%'

member2_residual_p:
  value: '%parties_list_rank_member_1_glitchitems_stacks%'
  max: '%parties_list_rank_member_1_glitchitems_max_stacks%'
#############################################################################################
member3_health_p:
  value: '%parties_list_rank_member_2_player_health_rounded%'
  max: '%parties_list_rank_member_2_player_max_health_rounded%'

member3_residual_p:
  value: '%parties_list_rank_member_2_glitchitems_stacks%'
  max: '%parties_list_rank_member_2_glitchitems_max_stacks%'
#############################################################################################
member4_health_p:
  value: '%parties_list_rank_member_3_player_health_rounded%'
  max: '%parties_list_rank_member_3_player_max_health_rounded%'

member4_residual_p:
  value: '%parties_list_rank_member_3_glitchitems_stacks%'
  max: '%parties_list_rank_member_3_glitchitems_max_stacks%'
