generate-default-files: true
generate-unicode-files: true
# 2026-09-22 (round 5): removed the imported Volya HUD Bundle content entirely
# (main resource bar, party HUD, skill bar) per operator request — the TAB
# scoreboard is the one HUD element we're keeping. No layouts active, so
# MythicHUD renders nothing; the plugin stays installed for a future config.
layout:
  default: []
check-update: 5
placeholder-update: 5
decimal-format: '#.##'
nexo-hook: true
copy-pack:
  enabled: true
  path: Nexo/pack/external_packs/MythicHud.zip
boss-bar:
  max: 7
  hud-position: 4
  color: yellow
disable-geyser-players: true
disable-netty-injection: false
hide-exp: false
hide-vanilla-hud: false
updaters:
  EXPERIENCE: true
  ARMOR: true
  CONSUMING: true
  RESPAWNING: true
  AIR: true
pack-support: all
default-namespace: mythichud
config-version: 11
