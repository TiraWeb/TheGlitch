# The Glitch — main HUD layout (positions/offsets from Volya's MMORPG HUD,
# Vanilla version — unchanged). "residual" replaces the original "mana" element.
# 2026-09-22 (round 4): removed the "experience" element (class level/XP bar) —
# its background graphic overlapped the residual/health row above it, and its
# %fill-value%/%fill-max% text (0/350-style) read as a stray floating number
# with no clear label. Class level is already shown on the TAB scoreboard.
mmohud-layout:
  elements:
    health:
      asset: 'health'
      position:
        x: 50.0
        y: 0.0
      offset:
        x: -99
        y: 51
    residual:
      asset: 'residual'
      position:
        x: 50.0
        y: 0
      offset:
        x: -99
        y: 39
    food:
      asset: 'food'
      position:
        x: 50
        y: 0.0
      offset:
        x: 1
        y: 40
    armor:
      asset: 'armor'
      position:
        x: 50
        y: 0.0
      offset:
        x: 1
        y: 50
    air:
      asset: 'air'
      align: center
      position:
        x: 50.0
        y: 50.0
      offset:
        x: 0
        y: -10
    money:
      asset: 'money'
      align: left
      position:
        x: 100.0
        y: 0
      offset:
        x: -2
        y: 13
