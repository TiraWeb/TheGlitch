# The Glitch — main HUD layout (positions/offsets from Volya's MMORPG HUD,
# Vanilla version — unchanged). "residual" replaces the original "mana" element.
mmohud-layout:
  elements:
    health:
      asset: 'health'
      position:
        x: 50.0
        y: 0.0
      offset:
        x: -99
        y: 51
    residual:
      asset: 'residual'
      position:
        x: 50.0
        y: 0
      offset:
        x: -99
        y: 39
    food:
      asset: 'food'
      position:
        x: 50
        y: 0.0
      offset:
        x: 1
        y: 40
    armor:
      asset: 'armor'
      position:
        x: 50
        y: 0.0
      offset:
        x: 1
        y: 50
    air:
      asset: 'air'
      align: center
      position:
        x: 50.0
        y: 50.0
      offset:
        x: 0
        y: -10
    experience:
      asset: 'experience'
      align: center
      position:
        x: 50.0
        y: 0
      offset:
        x: -1
        y: 27
    money:
      asset: 'money'
      align: left
      position:
        x: 100.0
        y: 0
      offset:
        x: -2
        y: 13
