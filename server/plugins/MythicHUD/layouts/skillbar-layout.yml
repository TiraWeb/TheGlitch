# The Glitch — class ability bar layout: bottom-center, above the hotbar.
# NOTE: this engine's position.y is measured from the BOTTOM of the screen (y:0 = hotbar
# row, higher = further up) — confirmed against Volya's own skill_casting_bar-layout.yml
# (position y:0, offset y:75) and against the main mmohud-layout.yml bars (all position
# y:0, offsets 27-51). The original y:100/-30 here was wrong (that's near the TOP of the
# screen) and is what caused the skill bar to render up near the tab list instead of above
# the hotbar — fixed 2026-09-22.
skillbar-layout:
  elements:
    skillbar:
      asset: 'skillbar'
      align: center
      position:
        x: 50.0
        y: 0.0
      offset:
        x: 0
        y: 65
