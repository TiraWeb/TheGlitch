residual:
  conditions:
    - gamemode{gm=creative,spectator} false hide
  layers:
    text_currentresidual:
      text: "%fill-value%"
      font: "mmohud-font"
      align: left
      offset:
        x: 44
        y: -3
      scale: 0.70
    text_divider:
      text: "/"
      font: "mmohud-font"
      align: center
      scale: 0.70
      offset:
        x: 46
        y: -3
