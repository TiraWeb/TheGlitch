      text: "<#e5bc63>%vault_eco_balance_formatted%"
      font: "mmohud-font"
      outlined: true
      offset:
        x: -11
        y: -2
    background1:
      align: left
      texture:
        path: assets/mmohud/background_coin_1.png
      conditions:
      - placeholder{ph=%vault_eco_balance_fixed%;v=1000;o=>=} false hide
    background2:
      align: left
      texture:
        path: assets/mmohud/background_coin_2.png
      conditions:
      - placeholder{ph=%vault_eco_balance_fixed%;v=1000;o=>=} true hide
      - placeholder{ph=%vault_eco_balance_fixed%;v=10000;o=>=} false hide
    background3:
      align: left
      texture:
        path: assets/mmohud/background_coin_3.png
      conditions:
      - placeholder{ph=%vault_eco_balance_fixed%;v=10000;o=<=} false hide
