###  THE GLITCH — MAIN RESOURCE HUD (adapted from Volya's MMORPG HUD, Vanilla version) ###
### health/food/armor/air are stock vanilla — "residual" replaces the pack's MMOCore mana bar
### with Residual Glitch stacks (%glitchitems_stacks%), "experience" shows class level/xp
### (%glitchclasses_*%) instead of vanilla XP, and "money" already works as-is via Vault
### (Eli's Coins / Glitch Shards).
health:
  conditions:
    - gamemode{gm=creative,spectator} false hide
  layers:
    text_currenthp:
      text: "%player_health_rounded%"
      font: "mmohud-font"
      align: left
      scale: 0.70
      offset:
        x: 44
        y: -4
      conditions:
      - placeholder{ph=%player_absorption%;v=0;o=>} false hide
    text_absorption:
      text: "<#ffea00>%math_0_{player_health_rounded}+{player_absorption}%"
      font: "mmohud-font"
      align: left
      scale: 0.70
      offset:
        x: 44
        y: -4
      conditions:
      - placeholder{ph=%player_absorption%;v=0;o=>} true hide
    text_divider:
      text: "/"
      font: "mmohud-font"
      align: center
      scale: 0.70
      offset:
        x: 46
        y: -4
    text_maxhp:
      text: "%player_max_health_rounded%"
      font: "mmohud-font"
      align: right
      scale: 0.70
      offset:
        x: 50
        y: -4
    icon_overlay_absorption:
      texture:
        path: assets/mmohud/icon_heart_absorption.png
      offset:
        x: -10
        y: -2
      conditions:
      - placeholder{ph=%player_absorption%;v=0;o=>} true hide
    icon:
      texture:
        path: assets/mmohud/icon_heart.png
      color: "#cb3040"
      offset:
        x: -10
        y: -2
      conditions:
      - effect{e=wither} false hide
    icon_wither:
      texture:
        path: assets/mmohud/icon_heart_wither.png
      offset:
        x: -10
        y: -2
      conditions:
      - effect{e=wither} true hide
    bar_overlay_absorption:
      texture:
        path: assets/mmohud/bar_fill_absorption.png
      offset:
        x: 0
        y: -2
      function:
        listener: absorption
        increment: 43
        orientation: horizontal
    bar_fill_wither:
      texture:
        path: assets/mmohud/bar_fill_wither.png
      color: "#6c6c6c"
      offset:
        x: 1
        y: -3
      conditions:
      - effect{e=wither} true hide
      function:
        listener: health
        increment: 28
        orientation: horizontal
    bar_fill:
      texture:
        path: assets/mmohud/bar_fill.png
      color: "#cb3040"
      offset:
        x: 1
        y: -3
      conditions:
      - effect{e=wither} false hide
      function:
        listener: health
        increment: 43
        orientation: horizontal
    bar_overlay_regeneration:
      texture:
        path: assets/mmohud/bar_overlay_regeneration.png
      color: "#f6388d"
      offset:
        x: 1
        y: -4
      conditions:
      - effect{e=regeneration} true hide
    bar_outline:
      texture:
        path: assets/mmohud/bar_outline.png
      offset:
        y: -2
####
####
air:
  conditions:
    - gamemode{gm=creative,spectator} false hide
  layers:
    icon:
      texture:
        path: assets/mmohud/icon_air.png
      offset:
        x: -2
        y: 0
      conditions:
      - placeholder{ph=%player_remaining_air%;v=%player_max_air%;o=<} true hide
    fill:
      texture:
        path: assets/mmohud/bar_fill_air.png
      color: "#51ccff"
      offset:
        x: 0
        y: -3
      function:
        listener: air
        increment: 40
        orientation: horizontal
      conditions:
      - placeholder{ph=%player_remaining_air%;v=%player_max_air%;o=<} true hide
    outline:
      texture:
        path: assets/mmohud/bar_outline_air.png
      offset:
        x: -1
        y: -2
      conditions:
      - placeholder{ph=%player_remaining_air%;v=%player_max_air%;o=<} true hide
####
####
food:
  conditions:
    - gamemode{gm=creative,spectator} false hide
  layers:
    text_currentfood:
      text: "%fill-value%"
      font: "mmohud-font"
      align: left
      scale: 0.70
      offset:
        x: 41
        y: -4
    text_divider:
      text: "/"
      font: "mmohud-font"
      align: center
      scale: 0.70
      offset:
        x: 43
        y: -4
    text_maxfood:
      text: "20"
      font: "mmohud-font"
      align: right
      scale: 0.70
      offset:
        x: 47
        y: -4
    icon_food:
      texture:
        path: assets/mmohud/icon_food.png
      offset:
        x: 89
        y: -2
      conditions:
      - effect{e=hunger} true texture assets/mmohud/icon_food_hunger.png
    fillhunger:
      texture:
        path: assets/mmohud/bar_fill_hunger.png
      color: "#b2a060"
      offset:
        x: 1
        y: -3
      conditions:
      - effect{e=hunger} true hide
      function:
        listener: food
        increment: 43
        orientation: horizontal
    fill:
      texture:
        path: assets/mmohud/bar_fill.png
      color: "#B88458"
      offset:
        x: 1
        y: -3
      function:
        listener: food
        increment: 43
        orientation: horizontal
      conditions:
      - effect{e=hunger} false hide
    outline:
      texture:
        path: assets/mmohud/bar_outline.png
      offset:
        y: -2
