### THE GLITCH — RAID PARTY HUD (adapted from Volya's Party HUD, "Parties" FULL version) ###
### 2026-09-22: switched to the Parties plugin's OWN relational placeholders
### (%parties_list_rank_<rank>_<number>_<placeholder>%) — this is what the original,
### unmodified Volya template used, and what MythicHUD's party HUD template actually
### needs to resolve "who is member N" at all. Two earlier attempts both failed
### identically (raw unparsed text, no server-side error either time): first chaining
### through the ParseOther PAPI expansion to read another party member's placeholder,
### then a native GlitchRaid PlaceholderAPI expansion with no third-party indirection.
### Both were investigated at length (bytecode decompiles of ParseOther + MythicHUD's
### own parser) with no explainable fault found. The common thread: MythicHUD's party
### HUD has no independent way to know who's in "slot 1/2/3/4" without a supported
### party plugin (Parties/MMOCore/Mythic Dungeons) doing that lookup itself — so it
### likely never even attempts to resolve slot text without one installed, regardless
### of which placeholders the YAML asks for.
###
### GlitchRaid stays the real party system (invites, raid rules, etc.) — PartiesBridge
### (plugins/GlitchRaid) mirrors its membership into a same-shape Parties party purely
### so this HUD has real data to read: our leader is always Parties rank "leader"
### (list_rank_leader_1, singular), other members are always Parties' default "member"
### rank (list_rank_member_1/2/3 for slots 2-4). Health uses the plain PAPI
### %player_health_rounded%; class uses our own %glitchclasses_class% expansion —
### Parties' list_rank_..._<placeholder> mechanism resolves either against the target
### member directly (see PartiesPlaceholder#parseListRank upstream).
###
### 2026-09-22 (round 4, first live playtest): confirmed the "true X hide/texture"
### condition direction works as expected elsewhere in this HUD (skill bar icons,
### class-icon texture swaps above) — so each slot now hides in the hub (party HUD is
### raid-only) and hides itself individually once the party doesn't have that many
### members, using %parties_members_total%.

partymember_1_p:
  conditions:
    - placeholder{ph=%world%;v=hub} true hide
    - placeholder{ph=%parties_members_total%;v=1;o=<} true hide
  layers:
    leader_icon:
      texture:
        path: assets/partyhud/party_leader.png
      offset:
        x: 91
        y: -2
    class_icon:
      texture:
        path: assets/partyhud/class/party_class_empty.png
      conditions:
        - placeholder{ph=%parties_list_rank_leader_1_glitchclasses_class%;v=Vanguard} true texture assets/partyhud/class/party_class_warrior
        - placeholder{ph=%parties_list_rank_leader_1_glitchclasses_class%;v=Warden} true texture assets/partyhud/class/party_class_cleric
        - placeholder{ph=%parties_list_rank_leader_1_glitchclasses_class%;v=Specter} true texture assets/partyhud/class/party_class_assassin
        - placeholder{ph=%parties_list_rank_leader_1_glitchclasses_class%;v=Operator} true texture assets/partyhud/class/party_class_artificier
      offset:
        x: 2
        y: -2
        z: 1
    name:
      text: "<#6cd71b>%parties_list_rank_leader_1%"
      font: "volya"
      outlined: true
      align: right
      scale: 0.6
      offset:
        x: 19
        y: -2
    hp_text:
      text: "%parties_list_rank_leader_1_player_health_rounded%"
      font: "volya"
      outlined: true
      align: left
      scale: 0.6
      offset:
        x: 56
        y: -8
    hp_text_divider:
      text: "/"
      font: "volya"
      outlined: true
      align: center
      scale: 0.6
      offset:
        x: 58
        y: -8
    hp_text_max:
      text: "%parties_list_rank_leader_1_player_max_health_rounded%"
      font: "volya"
      outlined: true
      align: right
      scale: 0.6
      offset:
        x: 61
        y: -8
    hp_bar_fill:
      texture:
        path: assets/partyhud/party_bar_fill_health.png
      offset:
        x: 20
        y: -9
      function:
        listener: member1_health_p
        increment: 30
        orientation: horizontal
    hp_bar_outline:
      texture:
        path: assets/partyhud/party_bar_outline_health.png
      offset:
        x: 19
        y: -8
    residual_bar_fill:
      texture:
        path: assets/partyhud/party_bar_fill_mana.png
      color: "#8a2be2"
      offset:
        x: 20
        y: -13
      function:
        listener: member1_residual_p
        increment: 30
        orientation: horizontal
    residual_bar_outline:
      texture:
        path: assets/partyhud/party_bar_outline_mana.png
      offset:
        x: 19
        y: -12
    background:
      texture:
        path: assets/partyhud/party_background.png
      offset:
        x: 0
        y: -14

