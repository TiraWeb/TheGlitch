### THE GLITCH — RAID PARTY HUD (adapted from Volya's Party HUD, "Parties" FULL version) ###
### Rewired from the third-party "Parties" plugin + MMOCore to GlitchRaid + GlitchClasses:
###   %parties_members_total%        -> %glitchraid_party_size%
###   list_rank_leader_N / member health/class lookups -> %glitchraid_member_N_name/health/max_health/class%
###   mmocore_class / mmocore_level  -> glitchclasses_class / glitchclasses_level
### Slot 1 is always the party leader (RaidExpansion.resolveSlotUuid). No mana bar per
### member (we have no mana resource) — replaced with each member's Residual Glitch stacks.
###
### 2026-09-22: originally chained the ParseOther PAPI expansion (same as the original
### pack) to read another member's %player_health_rounded%/%glitchclasses_class% — never
### reliably resolved in testing (stayed as literal unparsed text) even after installing
### ParseOther and confirming its exact syntax via bytecode decompile, and no error ever
### logged server-side to explain why. Replaced with member_N_health/max_health/class
### placeholders resolved natively in RaidExpansion.java (direct Player/PAPI lookups, no
### third-party relational-placeholder plugin or MythicHUD-side caching involved).
###
### NOTE: all 4 slots render unconditionally (no hide-if-empty-slot logic) since this
### plugin's exact true/false condition-direction semantics couldn't be verified without
### a live client — an empty slot should just show a blank name / 0 health rather than
### risk an inverted "always hidden" or "never hidden" bug. Revisit once playtested.

partymember_1_p:
  layers:
    leader_icon:
      texture:
        path: assets/partyhud/party_leader.png
      offset:
        x: 91
        y: -2
    class_icon:
      texture:
        path: assets/partyhud/class/party_class_empty.png
      conditions:
        - placeholder{ph=%glitchraid_member_1_class%;v=Vanguard} true texture assets/partyhud/class/party_class_warrior
        - placeholder{ph=%glitchraid_member_1_class%;v=Warden} true texture assets/partyhud/class/party_class_cleric
        - placeholder{ph=%glitchraid_member_1_class%;v=Specter} true texture assets/partyhud/class/party_class_assassin
        - placeholder{ph=%glitchraid_member_1_class%;v=Operator} true texture assets/partyhud/class/party_class_artificier
      offset:
        x: 2
        y: -2
        z: 1
    name:
      text: "<#6cd71b>%glitchraid_member_1_name%"
      font: "volya"
      outlined: true
      align: right
      scale: 0.6
      offset:
        x: 19
        y: -2
    hp_text:
      text: "%glitchraid_member_1_health%"
      font: "volya"
      outlined: true
      align: left
      scale: 0.6
      offset:
        x: 56
        y: -8
    hp_text_divider:
      text: "/"
      font: "volya"
      outlined: true
      align: center
      scale: 0.6
      offset:
        x: 58
        y: -8
    hp_text_max:
      text: "%glitchraid_member_1_max_health%"
      font: "volya"
      outlined: true
      align: right
      scale: 0.6
      offset:
        x: 61
        y: -8
    hp_bar_fill:
      texture:
        path: assets/partyhud/party_bar_fill_health.png
      offset:
        x: 20
        y: -9
      function:
        listener: member1_health_p
        increment: 30
        orientation: horizontal
    hp_bar_outline:
      texture:
        path: assets/partyhud/party_bar_outline_health.png
      offset:
        x: 19
        y: -8
    residual_bar_fill:
      texture:
        path: assets/partyhud/party_bar_fill_mana.png
      color: "#8a2be2"
      offset:
        x: 20
        y: -13
      function:
        listener: member1_residual_p
        increment: 30
        orientation: horizontal
    residual_bar_outline:
      texture:
        path: assets/partyhud/party_bar_outline_mana.png
      offset:
        x: 19
        y: -12
    background:
      texture:
        path: assets/partyhud/party_background.png
      offset:
        x: 0
        y: -14

