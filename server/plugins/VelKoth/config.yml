# VelKoth Configuration — The Glitch
# Generated from PluginConfig.java source

database:
  type: SQLITE
  host: localhost
  port: 3306
  database: velkoth
  username: root
  password: ""
  pool-size: 5

capture-defaults:
  capture-time: 30
  grace-period: 5
  capture-mode: CAPTURE
  max-score: 30
  contest-enabled: true

display:
  # Off: VelKoth shows every arena's idle bar to every online player (hub included, raw
  # arena ids). GlitchStash's per-world ExtractionHud boss bar replaces it.
  boss-bar-enabled: false
  action-bar-enabled: true
  titles-enabled: true
  sounds-enabled: true
  particles-enabled: true
  scoreboard-enabled: false
  show-idle-scoreboard: false
  override-other-scoreboards: true
  hologram-enabled: false
  hologram-y-offset: 3.0

schedule-timezone: UTC
schedule: []
