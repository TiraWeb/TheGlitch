moderator:
  tabprefix: "<gradient:#4ADE80:#16A34A><bold> [MOD]</bold></gradient>"
  tagprefix: "<gradient:#4ADE80:#16A34A><bold> [MOD]</bold></gradient>"
helper:
  tabprefix: "<gradient:#60A5FA:#1D4ED8><bold> [HELPER]</bold></gradient>"
  tagprefix: "<gradient:#60A5FA:#1D4ED8><bold> [HELPER]</bold></gradient>"
sentinel:
  tabprefix: "<gradient:#FBBF24:#B45309><bold> [SENTINEL]</bold></gradient>"
