# TAB v6 groups — The Glitch badge ranks (gradient tab + nametag).
# Chat uses the legacy LuckPerms prefix; tab/nametag get gradients here.
# Membership via tab.group.<name> (granted in LuckPerms). Highest first.
owner:
  tabprefix: "<gradient:#FFD94D:#FF6B35><bold> [OWNER]</bold></gradient>"
  tagprefix: "<gradient:#FFD94D:#FF6B35><bold> [OWNER]</bold></gradient>"
admin:
  tabprefix: "<gradient:#FF6B6B:#C81E1E><bold> [ADMIN]</bold></gradient>"
  tagprefix: "<gradient:#FF6B6B:#C81E1E><bold> [ADMIN]</bold></gradient>"
