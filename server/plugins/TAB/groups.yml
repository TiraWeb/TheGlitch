alpha:
  tabprefix: "<gradient:#F5D0FE:#D946EF><bold> [ALPHA]</bold></gradient>"
  tagprefix: "<gradient:#F5D0FE:#D946EF><bold> [ALPHA]</bold></gradient>"
donor:
  tabprefix: "%luckperms-prefix%"
  tagprefix: "%luckperms-prefix%"
default:
