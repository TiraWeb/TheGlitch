  tagprefix: "<gray> [Member]</gray>"

# fallback for anyone without a rank group
_DEFAULT_:
  tabprefix: "%luckperms-prefix%"
  tagprefix: "%luckperms-prefix%"
  customtabname: "%player%"
  tabsuffix: "%luckperms-suffix% %glitchraid_rank_icon%"
