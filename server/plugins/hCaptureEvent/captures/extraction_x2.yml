# The Glitch — Extraction Point X2 (-520, 180) in glitch_red
# Players stand in this WorldGuard region to channel extraction

settings:
  world: "glitch_red"
  region: "extraction_x2"
  capture-time: 10

time:
  enable: false

bossbar:
  enable: true
  title: "<purple>Extracting from X2..."
  color: "PURPLE"
  style: "SEGMENTED_10"

sounds:
  start: "BLOCK_BEACON_ACTIVATE"
  end: "ENTITY_PLAYER_LEVELUP"
  progress: "BLOCK_NOTE_BLOCK_PLING"
  win: "UI_TOAST_CHALLENGE_COMPLETE"

particles:
  enable: false

actions:
  start:
    - "[ActionBar] <purple>Extracting from X2... <white>{progress}%</white>"
  enter:
    - "[ActionBar] <purple>Extracting from X2... <white>{progress}%</white>"
  exit:
    - "[ActionBar] <red>Extraction interrupted!"
  progress:
    - "[ActionBar] <purple>Extracting... <white>{progress}%</white>"
  places:
    1:
      - "[Console] eco give {player} 50"
      - "[Message] <green>Extraction complete! +50 Glitch Shards banked."
