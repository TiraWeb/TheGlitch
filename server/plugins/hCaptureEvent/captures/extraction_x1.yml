# The Glitch — Extraction Point X1 (450, -250) in glitch_red
# Players stand in this WorldGuard region to channel extraction

settings:
  world: "glitch_red"
  region: "extraction_x1"
  capture-time: 10
  mode: "player"
  min-players: 1

bossbar:
  enable: true
  title: "&5&lExtracting X1 &7| &f{progress}% &7| &f{timeLeft}s left"
  color: "PURPLE"
  style: "SEGMENTED_10"

messages:
  start:
    - "&r"
    - "&5&l[GLITCH] &7Extraction beacon &5X1 &7activated! &fGet to the zone."
    - "&r"
  end:
    - "&r"
    - "&5&l[GLITCH] &7Extraction beacon &5X1 &7deactivated."
    - "&r"
  progress:
    - "&5Extracting &7progress: &f{progress}%"
  leader-change:
    - "&5&l[GLITCH] &fNew leader: &5{leader} &7({progress}%)"
  region-enter:
    - "&5&l[EXTRACTION] &fYou entered the extraction zone! Stay to channel."
  region-leave:
    - "&c&l[EXTRACTION] &fYou left the zone — progress reset!"

time:
  enable: false

sounds:
  start: "BLOCK_BEACON_ACTIVATE"
  end: "ENTITY_PLAYER_LEVELUP"
  progress: "BLOCK_NOTE_BLOCK_PLING"
  win: "UI_TOAST_CHALLENGE_COMPLETE"

particles:
  enable: true
  type: "FLAME"
  count: 200

actions:
  enter:
    - "[Message] &5&l[EXTRACTION] &fStay in the zone to extract. &7{progress}%"
  exit:
    - "[Message] &c&l[EXTRACTION] &fExtraction interrupted! You left the zone."
  seconds:
    5:
      - "[Sound] BLOCK_NOTE_BLOCK_PLING:1:1.5"
    10:
      - "[Console] eco give {player} 50"
      - "[Message] &5&l[EXTRACTION] &fExtraction complete! &a+50 Glitch Shards &fbanked."
