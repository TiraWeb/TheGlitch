# The Glitch — Extraction Point X2 (overwrites plugin clan default)
settings:
  world: "glitch_red"
  region: "extraction_x2"
  capture-time: 10

bossbar:
  enable: true
  title: "&5&lExtracting X2 &7| &f{progress}% &7| &f{timeLeft}s left"
  color: "PURPLE"
  style: "SEGMENTED_10"

messages:
  start:
    - "&r"
    - "&5&l[GLITCH] &7Extraction beacon &5X2 &7activated!"
    - "&r"
  end:
    - "&r"
    - "&5&l[GLITCH] &7Extraction beacon &5X2 &7deactivated."
    - "&r"
  progress:
    - "&5Extracting &7progress: &f{progress}%"
  leader-change:
    - "&5&l[GLITCH] &fNew leader: &5{leader} &7({progress}%)"
  region-enter:
    - "&5&l[EXTRACTION] &fYou entered the extraction zone!"
  region-leave:
    - "&c&l[EXTRACTION] &fYou left the zone!"

time:
  enable: false

sounds:
  start: "BLOCK_BEACON_ACTIVATE"
  end: "ENTITY_PLAYER_LEVELUP"
  progress: "BLOCK_NOTE_BLOCK_PLING"
  win: "UI_TOAST_CHALLENGE_COMPLETE"

particles:
  enable: true
  type: FLAME
  count: 200

rewards:
  winner:
    - "eco give %player% 50"
  other-players: []
  seconds:
    10:
      - "eco give %player% 50"

actions:
  enter:
    - "[Message] &5&l[EXTRACTION] &fStay to extract. &7{progress}%"
  exit:
    - "[Message] &c&l[EXTRACTION] &fExtraction interrupted!"
  seconds:
    5:
      - "[Sound] BLOCK_NOTE_BLOCK_PLING:1:1.5"
