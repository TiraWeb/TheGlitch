settings:
  world: "glitch_red"
  region: "extraction_x3"
  capture-time: 300

bossbar:
  enable: true
  title: "&5&lExtract X3 &7| &f{leader} &7| &f{progress}% &7| &f{timeLeft}s"
  color: "PURPLE"
  style: "SEGMENTED_20"

messages:
  start:
    - "&r"
    - "&5&l[GLITCH] &fExtraction beacon &5X3 &7activated!"
    - "&5&l[GLITCH] &7Get to the zone — &f/hcaptureevent start"
    - "&r"
  end:
    - "&r"
    - "&5&l[GLITCH] &fExtraction beacon &5X3 &7complete!"
    - "&5&l[GLITCH] &7Winner: &5{leader} &7({progress}%)"
    - "&r"
  progress:
    - "&5Extraction &7progress: &f{progress}%"
  leader-change:
    - "&5&l[GLITCH] &fNew leader: &5{leader} &7({progress}%)"
  region-enter:
    - "&5&l[EXTRACTION] &fYou entered the extraction zone!"
  region-leave:
    - "&c&l[EXTRACTION] &fYou left the zone!"

sounds:
  start: "BLOCK_BEACON_ACTIVATE"
  end: "ENTITY_PLAYER_LEVELUP"
  progress: "BLOCK_NOTE_BLOCK_PLING"
  win: "UI_TOAST_CHALLENGE_COMPLETE"

particles:
  enable: true
  type: FLAME
  count: 300

rewards:
  winner:
    - "eco give %player% 100"
  other-players: []
  seconds:
    30:
      - "eco give %player% 10"
    60:
      - "eco give %player% 10"
    120:
      - "eco give %player% 10"
    180:
      - "eco give %player% 10"
    240:
      - "eco give %player% 10"
    300:
      - "eco give %player% 10"
