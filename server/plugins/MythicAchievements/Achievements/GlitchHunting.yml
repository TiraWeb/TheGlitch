# The Glitch — MythicAchievements: bestiary kill achievements (2026-09-20)
# One per mob in server/plugins/MythicMobs/Mobs/, scaled by GAME_DESIGN tier
# (docs: T1 fodder=50 kills, T2=25, T3 elite=5, T4 boss=1), plus a capstone
# "kill every mob type once" achievement. Reuses the built-in MONSTER_HUNTING
# category. XP rewards only — not balance-tuned against the shard economy.

# --- Tier 1 fodder ---
CRAWLER_CULLER:
  Display: 'Crawler Culler'
  Description: 'Defeat 50 Corrupted Crawlers'
  Category: MONSTER_HUNTING
  Frame: TASK
  Icon:
    Material: GUNPOWDER
  Criteria:
    KILL:
      Type: KILL_MYTHIC_MOB
      MobType: CorruptedCrawler
      Amount: 50
      Conditions: []
  Reward:
    Message: 'You have thinned the Corrupted Crawlers!'
    Drops:
    - 30 EXPERIENCE
    Skills: []

