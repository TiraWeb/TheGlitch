# GlitchClasses — The Glitch Class System
# 4 classes: Vanguard, Warden, Specter, Operator

# Maximum class level
max-level: 10

# Level at which the class ultimate unlocks
ultimate-level: 10

# Worlds where class abilities are active
game-worlds:
  - glitch_red
  - glitch_red_eleria
  - glitch_red_horizons

# Also active in worlds matching this regex: the MythicDungeons boss dungeon
# instances, named <dungeon id>_<n> (ids from scripts/dungeon_md.py).
game-world-pattern: "^(small|haunted|puzzle|desert|aztec|crimson|nether|pirate|medium|town|mythic)_[0-9]+$"

# Cost in shards to reset class (0 = free)
reset-cost: 500

# Starter kit â€” granted on the player's very first class selection (once ever).
# Entries: vanilla "material" or Nexo "nexo" id + amount.
starter-kit:
  enabled: true
  once-per-player: true
  items:
    helmet: { material: IRON_HELMET, amount: 1 }
    chestplate: { material: IRON_CHESTPLATE, amount: 1 }
    leggings: { material: IRON_LEGGINGS, amount: 1 }
    boots: { material: IRON_BOOTS, amount: 1 }
    blade: { material: IRON_SWORD, amount: 1 }
    shield: { material: SHIELD, amount: 1 }
    food: { material: COOKED_BEEF, amount: 16 }
    healing: { nexo: healing_potion, amount: 3 }
    bandages: { nexo: bandage, amount: 4 }
    frags: { nexo: frag_grenade, amount: 2 }
    smoke: { nexo: smoke_grenade, amount: 1 }
    cache-key: { nexo: cache_key, amount: 1 }
    rune-fragments: { nexo: rune_fragment, amount: 5 }

