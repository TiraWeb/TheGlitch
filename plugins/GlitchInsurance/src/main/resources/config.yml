config-version: 1
# GlitchInsurance — Shard-backed item insurance (ROADMAP 5.9.4)
# Pay premium to protect gear on death. Cooldowns, claim window, per-player YAML persistence.

insurance:
  premium-per-item: 100
  max-insured-items: 3
  claim-window-seconds: 300
  cooldown-seconds: 60
  enabled-worlds:
    - glitch_red
    - glitch_pve

messages:
  insured: "<green>Insured <gray><item></gray> for <gold><premium> Shards</gold> (<count>/<max> slots).</green>"
  already-insured: "<red>That item is already insured.</red>"
  max-reached: "<red>You have reached the maximum insured items (<max>).</red>"
  not-enough-shards: "<red>Not enough Shards — you need <premium> Shards to insure this item.</red>"
  claim: "<green>Your insured gear was protected on death! Use <white>/insurance claim</white> to retrieve if needed.</green>"
  expired: "<red>Your insurance for <item> has expired.</red>"
  no-insurance: "<red>You have no insured items.</red>"
  cooldown: "<red>Insurance is on cooldown — try again in <seconds>s.</red>"
  reload: "<green>GlitchInsurance configuration reloaded.</green>"
  list-header: "<gold>Insured items (<count>/<max>):</gold>"
  list-entry: "<gray>- <item> <dark_gray>(<remaining>s remaining)</dark_gray></gray>"
  help: "<yellow>/insurance buy</yellow> <gray>— insure held item</gray> <dark_gray>|</dark_gray> <yellow>/insurance list</yellow> <gray>— show insured</gray> <dark_gray>|</dark_gray> <yellow>/insurance claim</yellow> <gray>— claim protected gear</gray>"
  claimed: "<green>Claimed <count> insured item(s).</green>"
  admin-reloaded: "<green>GlitchInsurance reloaded.</green>"
  admin-cleared: "<red>Cleared insurance for <player>.</red>"
  admin-list-header: "<gold>Insured for <player> (<count> items):</gold>"
  no-permission: "<red>No permission.</red>"
  not-player: "<red>Players only.</red>"
  hold-item: "<red>Hold an item in your main hand to insure.</red>"
  inventory-full: "<yellow>Inventory full — item dropped at your feet.</yellow>"

modern-ui:
  remote-perm: theglitch.remoteui
  world-panel:
    enabled: true
    world: hub
    x: 106.0
    y: -33.5
    z: 62.5
    facing: west
    spacing: 1.35
