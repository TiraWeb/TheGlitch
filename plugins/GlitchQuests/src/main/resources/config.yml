      icon: WRITABLE_BOOK
      reward: { shards: 2500, items: { rift_key: 1 } }
    exterminator:
      name: "Exterminator"
      description: "Slay hostile mobs this week."
      type: KILL_MOB
      amount: 250
      icon: DIAMOND_SWORD
      reward: { shards: 1200 }
