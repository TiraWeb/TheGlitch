config-version: 1
# GlitchHideout — The Glitch hideout progression (design GAME_DESIGN.md §4)
# Stations upgrade with Glitch Shards. Prerequisites are "station:level".

med-cooldown-seconds: 30

modern-ui:
  dialogs: false
  remote-perm: theglitch.remoteui
  # Floating wall panel rendered with display entities (build via /hideoutui panel here)
  world-panel:
    enabled: true
    world: hub
    x: 90.0
    y: -33.5
    z: 10.0
    facing: west
    spacing: 1.35

stations:
  core:
    display: "<light_purple>Arcane Core"
    icon: BEACON
    description: "Powers the anomaly stations. Prerequisite for the Armory."
    costs: [300, 1000, 4000]
    requires: { 1: "workbench:1", 2: "intel:1", 3: "intel:2" }
  workbench:
    display: "<gold>Workbench"
    icon: CRAFTING_TABLE
    description: "Craft weapons, keys and consumables from rift materials."
    costs: [100, 500, 2000]
    requires: { 1: "", 2: "med:1", 3: "intel:2" }
  med:
    display: "<green>Med Station"
    icon: BREWING_STAND
    description: "Free full heal between raids (30s cooldown)."
    costs: [50, 300, 1000]
    requires: { 1: "", 2: "workbench:1", 3: "workbench:2" }
  stash:
    display: "<dark_purple>Stash"
    icon: CHEST
    description: "Extended storage: 27 / 45 / 54 slots."
    costs: [200, 800, 3000]
    requires: { 1: "", 2: "workbench:1", 3: "med:2" }
  intel:
    display: "<aqua>Intel Center"
    icon: SPYGLASS
    description: "Unlocks deeper hideout access."
    costs: [150, 600, 2500]
    requires: { 1: "", 2: "workbench:1", 3: "stash:2" }
  trainer:
    display: "<red>Skill Trainer"
    icon: EXPERIENCE_BOTTLE
    description: "Class management — open the class menu (upgrades / reset)."
    costs: [100]
    requires: { 1: "" }
  armory:
    display: "<blue>Armory"
    icon: ITEM_FRAME
    description: "Store and auto-sort your gear. 27 / 54 slots."
    costs: [250, 750]
    requires: { 1: "stash:2", 2: "core:1" }

# Workbench recipes (ITEM_SYSTEM.md §7, §14).
# materials = Nexo item ids + counts; output = console command (<player> placeholder).
# blueprint: true = locked until the player learns blueprint_<recipe id> (right-click it).
recipes:
  healing_potion:
    display: "<green>Healing Potion"
    icon: POTION
    output: "nexo give healing_potion 3 <player>"
    materials: { rune_fragment: 5, rift_crystal: 1 }
  base_weapon:
    display: "<green>Base Blade (Uncommon)"
    icon: STONE_SWORD
    output: "glitchitems give uncommon blade random <player>"
    materials: { rune_fragment: 3, rift_crystal: 1 }
