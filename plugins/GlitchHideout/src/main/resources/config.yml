# Recycler (/recycle, or the button in the Workbench): breaks junk into salvage.
# Needs Workbench Lv 1. item id -> outputs (Nexo id: amount).
recycler:
  rusted_gear: { scrap_plating: 3 }
  cracked_screen: { scrap_plating: 1, frayed_wiring: 2 }
  dead_battery: { frayed_wiring: 2, coolant_cell: 1 }
  shattered_lens: { polymer_goo: 2, coolant_cell: 1 }
  corrupted_drive: { frayed_wiring: 3, rune_fragment: 2 }
  broken_drone: { scrap_plating: 3, frayed_wiring: 2, coolant_cell: 2, circuit_core: 1 }
