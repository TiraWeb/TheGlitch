# GlitchStash — The Glitch Extraction Vault
# Items saved automatically on successful extraction

# Maximum number of items a player can store (full inventory = 41 slots)
# VIP players get extra_slots added to this
max-items: 41
extra-slots: 9

# Stash expiry in hours (0 = never expires)
stash-expiry-hours: 0

# Residual Glitch payout: on extraction, pay bonus shards =
# sell value of saved loot x (payout multiplier - 1) from GlitchItems stacks.
payout-enabled: true

# Fast/Silent extraction variants (design ROADMAP 5.11.5).
# VelKoth arenas provide the shorter capture timers (e.g. /koth set time fast 15);
# this plugin enforces the key: right-click the key inside the zone to consume it
# and arm the variant, then win the zone to get the payout bonus.
# Zones are rectangles (x/z bounds, y ignored). Empty key-id = no key required.
extraction-variants:
  enabled: true
  # When true, winning a key zone without consuming the key gives no variant
  # bonus and logs a warning (the VelKoth win itself cannot be cancelled).
  enforce-key: true
  # How long a consumed key stays armed (seconds) — covers the capture duration
  arm-duration-seconds: 180
  # Zones are rectangles (x/z bounds, y ignored) mirroring your in-game VelKoth
  # arenas. Empty by default — the operator places arenas in-game, then adds the
  # matching bounds here and runs /extractadmin reload. Example shape:
  #   fast:
  #     world: glitch_red
  #     x1: -50.0
  #     z1: -50.0
  #     x2: -20.0
  #     z2: -20.0
  #     key-id: "fast_extract_key"
  #     key-material: "TRIPWIRE_HOOK"
  #     key-name: "Fast Extract Key"
  #     payout-bonus: 5
  zones: {}

# Display settings
display-name: "<dark_purple><bold>YOUR STASH</bold></dark_purple>"
lore:
  - "<gray>Items saved from your last extraction"
  - "<gray>Click to retrieve"

# Messages (MiniMessage format)
messages:
  extracted: "<green>Extraction complete! Your gear has been stored safely."
  glitch-payout: "<dark_red>Residual Glitch payout: <gold>+<amount> Shards</gold> <gray>(x<multiplier>)</gray>"
  stash-saved: "<gray>Your inventory has been saved to your stash."
  stash-opened: "<gold>Stash opened</gold> <dark_gray>|</dark_gray> <gray>Click items to retrieve"
  stash-full: "<red>Your stash is full! Retrieve items before extracting again."
  stash-empty: "<red>Your stash is empty."
  item-retrieved: "<green>+ <item></green>"
  all-retrieved: "<green>All items retrieved!"
  teleporting: "<dark_purple>Teleporting to stash..."
  admin-cleared: "<red>Stash cleared for <gold><player></gold>."
  admin-reloaded: "<green>GlitchStash configuration reloaded."
