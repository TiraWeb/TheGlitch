config-version: 1
# GlitchStash â€” The Glitch Extraction Vault
# Items saved automatically on successful extraction

# Residual Glitch payout: on extraction, pay bonus shards =
# sell value of saved loot x (payout multiplier - 1) from GlitchItems stacks.
payout-enabled: true

# Fast/Silent extraction variants (design ROADMAP 5.11.5).
# VelKoth arenas provide the shorter capture timers (e.g. /koth set time fast 15);
# this plugin enforces the key: right-click the key inside the zone to consume it
# and arm the variant, then win the zone to get the payout bonus.
# Zones are rectangles (x/z bounds, y ignored). Empty key-id = no key required.
extraction-variants:
  enabled: true
  # When true, winning a key zone without consuming the key gives no variant
  # bonus and logs a warning (the VelKoth win itself cannot be cancelled).
  enforce-key: true
  # How long a consumed key stays armed (seconds) â€” covers the capture duration
  arm-duration-seconds: 180
  # Zones are rectangles (x/z bounds, y ignored) mirroring your in-game VelKoth
  # arenas. Empty by default â€” the operator places arenas in-game, then adds the
  # matching bounds here and runs /extractadmin reload. Example shape:
  #   fast:
  #     world: glitch_red
  #     x1: -50.0
  #     z1: -50.0
  #     x2: -20.0
  #     z2: -20.0
  #     key-id: "fast_extract_key"
  #     key-material: "TRIPWIRE_HOOK"
  #     key-name: "Fast Extract Key"
  #     payout-bonus: 5
  zones: {}

# Automated extraction — t0 start ALL arenas, t0+30m RED kill, t0+30m+5s scatter, t0+31m restart.
# Interval is the full wall-clock between t0 starts (raidDuration + buffer).
# Scheduler discovers arenas via VelKoth API reflectively; empty arenas list = all discovered.
# Fallback: dispatch "koth start <arena>" for each discovered name. See
# GlitchStash/src/main/java/com/theglitch/glitchstash/AutoExtractScheduler.java:1
auto-extract:
  enabled: true
  # Full cycle in minutes (30m raid + 1m buffer = 31 minutes)
  interval-minutes: 31
  # Raid length before RED-world timeout kill (coordinated with GlitchRaid)
  raid-duration-minutes: 30
  # Buffer between scatter loot and next cycle (interval = raidDuration + buffer)
  buffer-minutes: 1
  # RED worlds — each gets its OWN independent 31m cycle, 3 dynamic extraction
  # points, and timeout kill (only that world is killed at t0+30m, not hub/pve).
  # (Legacy: the old singular "red-world" key is still read as a fallback if
  # this list is empty/absent.)
  red-worlds:
    - "glitch_red"
    - "glitch_red_eleria"
    - "glitch_red_horizons"
  # red-world: "glitch_red"
  # Allow-list of arenas to auto-start. Empty = all discovered via VelKoth API or arenas.yml.
  # Example: arenas: ["extraction_alpha", "extraction_bravo"]
  # NOTE: legacy (non-dynamic) mode is not per-world — keep dynamic.enabled: true
  # for any world beyond the first if running more than one red world.
  arenas: []
  # Dynamic extraction — each cycle picks N random validated surface spots on the
  # land box, creates/moves VelKoth arenas there (arena-prefix + index), starts them
  # and shows locator markers. Variant-key zones follow the arenas automatically.
  # Set enabled: false to use the legacy fixed arena discovery above instead.
  dynamic:
    enabled: true
    # Number of extraction points per cycle
    points: 3
    # Land box center and half-width (random x/z within center ± radius) — shared
    # default for every red world. If a new map's playable area isn't centered
    # near here, override it per-world below rather than forcing this default.
    center-x: 1000
    center-z: 1000
    radius: 1000
    # Minimum 2D distance between two points in the same cycle
    min-separation: 400
    # Reject spots above this Y (floating islands); capture square must be ±3 flat
    max-surface-y: 100
    # VelKoth capture timer for the generated arenas
    capture-time-seconds: 30
    # Arena id prefix — slots are <prefix>0, <prefix>1, ... Per-world overrides
    # below prevent concurrent cycles across red worlds from colliding on the
    # same VelKoth arena ids.
    arena-prefix: extraction_dyn
    # Existing static arenas used to fill in when random validation fails
    fallback-arenas: []
  # Per-world arena-id prefix — falls back to "<dynamic.arena-prefix>_<worldsuffix>"
  # for any world not listed here (glitch_red keeps the original "extraction_dyn"
  # prefix so its live arena ids don't change under it).
  arena-prefix-overrides:
    glitch_red: "extraction_dyn"
    glitch_red_eleria: "extraction_dyn_eleria"
    glitch_red_horizons: "extraction_dyn_horizons"
  # Per-world override of the dynamic land box — the shared (1000,1000) default
  # only suits glitch_red. Eleria/Horizons' pre-generated terrain (from their
  # source map, not Chunky) sits elsewhere; the first live cycle at the shared
  # default only validated 1/3 points on each (mostly ocean/ungenerated), so
  # these were set from an RCON terrain scan + the actual points the picker
  # validated on that cycle (2026-09-21). Revisit if cycles still come up short.
  dynamic-overrides:
    glitch_red_eleria:
      center-x: 350
      center-z: 200
      radius: 400
    glitch_red_horizons:
      center-x: 150
      center-z: 100
      radius: 400

# Modern UI layer — shared stash kiosk wall + dialog-based remote stash
modern-ui:
  # Permission that unlocks the ENDER_EYE "stash remote" kiosk cell (dialog stash)
  remote-perm: "theglitch.remoteui"
  # Kiosk wall rendered with display entities in the hub lobby
  world-panel:
    enabled: true
    world: hub
    x: 67.5
    y: -43.5
    z: -5.5
    facing: west
    spacing: 1.35

# Display settings
display-name: "<font:minecraft:default>\ue049</font> <gradient:#C084FC:#F0ABFC><bold>YOUR STASH</bold></gradient>"

