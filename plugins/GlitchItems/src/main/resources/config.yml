# GlitchItems — The Glitch item system
# Gear rolls, Unstable Rift identify, Resonance, Residual Glitch
# Design: docs/ITEM_SYSTEM.md

# Chance a rift reveals a weapon instead of an armor piece
reveal-weapon-chance: 0.6

# Shard fee to identify a rift (per rarity)
identify-fees:
  common: 5
  uncommon: 20
  rare: 75
  epic: 250
  legendary: 800

# What merchants pay for gear (sell price line on the item)
sell-values:
  common: 3
  uncommon: 17
  rare: 75
  epic: 350
  legendary: 1750

# Stat roll ranges per rarity: [min, max]
stat-ranges:
  damage: { common: [0,5], uncommon: [5,10], rare: [10,15], epic: [15,20], legendary: [20,30] }
  armor:  { common: [0,2], uncommon: [2,4], rare: [4,6], epic: [6,8], legendary: [8,10] }
  speed:  { common: [0,2], uncommon: [2,4], rare: [4,6], epic: [6,8], legendary: [8,12] }
  maxhp:  { common: [0,0], uncommon: [1,2], rare: [2,3], epic: [3,5], legendary: [5,8] }
  stars:  { common: [0,1], uncommon: [0,2], rare: [0,3], epic: [1,4], legendary: [2,5] }

# Extra % added to the weapon Resonance damage bonus
resonance-boost:
  common: 0
  uncommon: 1
  rare: 1
  epic: 2
  legendary: 2

# Special attributes (per rarity tier; empty = none)
attributes:
  weapon:
    lifesteal: { rare: 3, epic: 6, legendary: 8 }
    fire-aspect: { rare: 1, epic: 2, legendary: 2 }
  armor:
    damage-reduction: { rare: 5, epic: 8, legendary: 12 }

# Resonance combat math
resonance:
  weapon-damage-vs-matching: 25
  armor-reduction-per-piece: 10
  armor-reduction-cap: 40
  armor-points-reduction-per-point: 2
  armor-points-cap: 25
  armor-attribute-reduction-cap: 30

# Base material per rarity tier (common -> legendary)
materials:
  blade: [WOODEN_SWORD, STONE_SWORD, IRON_SWORD, DIAMOND_SWORD, NETHERITE_SWORD]
  greatblade: [WOODEN_AXE, STONE_AXE, IRON_AXE, DIAMOND_AXE, NETHERITE_AXE]
  arcane_staff: [STICK, BLAZE_ROD, BONE, BLAZE_ROD, NETHER_STAR]
  helmet: [LEATHER_HELMET, CHAINMAIL_HELMET, IRON_HELMET, DIAMOND_HELMET, NETHERITE_HELMET]
  chestplate: [LEATHER_CHESTPLATE, CHAINMAIL_CHESTPLATE, IRON_CHESTPLATE, DIAMOND_CHESTPLATE, NETHERITE_CHESTPLATE]
  leggings: [LEATHER_LEGGINGS, CHAINMAIL_LEGGINGS, IRON_LEGGINGS, DIAMOND_LEGGINGS, NETHERITE_LEGGINGS]
  boots: [LEATHER_BOOTS, CHAINMAIL_BOOTS, IRON_BOOTS, DIAMOND_BOOTS, NETHERITE_BOOTS]

rarity-colors:
  common: "<white>"
  uncommon: "<green>"
  rare: "<blue>"
  epic: "<light_purple>"
  legendary: "<gold>"

# Residual Glitch — greed stacks while lingering in the rift
residual-glitch:
  enabled-worlds: [glitch_red]
  stack-interval-minutes: 5
  max-stacks: 8
  damage-taken-per-stack: 5
  loot-luck-per-stack: 5
  elite-hunt-stacks: 5
  payout-per-stack: 0.10
  # Boss bar HUD (top of screen, MiniMessage format) — {stacks}/{max}/{dmg}/{payout} placeholders
  bossbar-title: "<red>Residual Glitch: <white>{stacks}/{max}</white> <dark_gray>(<gray>+{dmg}% dmg taken, +{payout}% payout</gray>)</dark_gray>"
  # Mirror stacks onto the vanilla XP bar (level = stacks, fill = 8/8).
  # Off by default — the boss bar is the HUD; the XP bar is free for other uses.
  show-xp-bar: false
