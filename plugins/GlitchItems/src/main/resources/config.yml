config-version: 2
# GlitchItems — The Glitch item system
# Gear rolls, Unstable Rift identify, Resonance, Residual Glitch
# Design: docs/ITEM_SYSTEM.md, balance: docs/ITEM_BALANCE.md
# v2 (2026-09-02): income retune (fees/containers), roll-based sell values,
#                  attribute pools (execute/frost-touch/thorns/glitch-ward),
#                  archetype modifiers, staff ladder fix.

# Chance a rift reveals a weapon instead of an armor piece
reveal-weapon-chance: 0.6

# Shard fee to identify a rift (per rarity)
identify-fees:
  common: 5
  uncommon: 20
  rare: 60
  epic: 250
  legendary: 800

# Gear sell value: base per rarity + total star pips x star-sell-bonus[rarity]
sell-values:
  common: 3
  uncommon: 17
  rare: 75
  epic: 350
  legendary: 1750
star-sell-bonus:
  common: 2
  uncommon: 8
  rare: 25
  epic: 90
  legendary: 350

# Stat roll ranges per rarity: [min, max]
stat-ranges:
  damage: { common: [0,5], uncommon: [5,10], rare: [10,15], epic: [15,20], legendary: [20,30] }
  armor:  { common: [0,2], uncommon: [2,4], rare: [4,6], epic: [6,8], legendary: [8,10] }
  speed:  { common: [0,2], uncommon: [2,4], rare: [4,6], epic: [6,8], legendary: [8,12] }
  maxhp:  { common: [0,0], uncommon: [1,2], rare: [2,3], epic: [3,5], legendary: [5,8] }
  stars:  { common: [0,1], uncommon: [0,2], rare: [0,3], epic: [1,4], legendary: [2,5] }

# Extra % added to the weapon Resonance damage bonus
resonance-boost:
  common: 0
  uncommon: 1
  rare: 1
  epic: 2
  legendary: 2

# Special attributes (per rarity tier; empty = none).
# Weapons: Rare/Epic roll ONE of the pool, Legendary rolls TWO distinct.
# Armor: exactly ONE attribute per piece (which one varies).
attributes:
  weapon:
    lifesteal: { rare: 3, epic: 6, legendary: 8 }
    fire-aspect: { rare: 1, epic: 2, legendary: 2 }
    # +% damage vs targets below 30% max HP (finishing tool)
    execute: { rare: 10, epic: 15, legendary: 20 }
    # Slowness level applied for 2s on hit (chase tool)
    frost-touch: { rare: 1, epic: 2, legendary: 3 }
  armor:
    damage-reduction: { rare: 5, epic: 8, legendary: 12 }
    # % of received melee damage reflected at the attacker
    thorns: { rare: 2, epic: 4, legendary: 6 }
    # extra % Resonance-damage reduction (stacks into the resonance bucket)
    glitch-ward: { rare: 3, epic: 5, legendary: 8 }

# Archetype identity modifiers (flat, added in buildItem)
archetype:
  # Arcane Staff flat ATTACK_DAMAGE per rarity tier (compensates weak rod base)
  arcane-staff-attack-bonus: [2, 3, 5, 7, 9]
  # Greatblade ATTACK_KNOCKBACK per rarity tier
  greatblade-knockback-bonus: [0.1, 0.15, 0.2, 0.25, 0.3]

# Void Infusion consumable — right-hand application to held gear (off-hand
# holds the target): +1 Resonance boost up to this cap + star reroll (min +1)
void-infusion:
  max-boost: 4

# Resonance combat math
resonance:
  weapon-damage-vs-matching: 25
  armor-reduction-per-piece: 10
  armor-reduction-cap: 40
  armor-points-reduction-per-point: 2
  armor-points-cap: 25
  armor-attribute-reduction-cap: 30

# Base material per rarity tier (common -> legendary)
materials:
  blade: [WOODEN_SWORD, STONE_SWORD, IRON_SWORD, DIAMOND_SWORD, NETHERITE_SWORD]
  greatblade: [WOODEN_AXE, STONE_AXE, IRON_AXE, DIAMOND_AXE, NETHERITE_AXE]
  arcane_staff: [STICK, BLAZE_ROD, BONE, END_ROD, NETHER_STAR]
  helmet: [LEATHER_HELMET, CHAINMAIL_HELMET, IRON_HELMET, DIAMOND_HELMET, NETHERITE_HELMET]
  chestplate: [LEATHER_CHESTPLATE, CHAINMAIL_CHESTPLATE, IRON_CHESTPLATE, DIAMOND_CHESTPLATE, NETHERITE_CHESTPLATE]
  leggings: [LEATHER_LEGGINGS, CHAINMAIL_LEGGINGS, IRON_LEGGINGS, DIAMOND_LEGGINGS, NETHERITE_LEGGINGS]
  boots: [LEATHER_BOOTS, CHAINMAIL_BOOTS, IRON_BOOTS, DIAMOND_BOOTS, NETHERITE_BOOTS]

rarity-colors:
  common: "<white>"
  uncommon: "<green>"
  rare: "<blue>"
  epic: "<light_purple>"
  legendary: "<gold>"

# Residual Glitch — greed stacks while lingering in the rift
residual-glitch:
  enabled-worlds: [glitch_red]
  stack-interval-minutes: 5
  max-stacks: 8
  damage-taken-per-stack: 5
  loot-luck-per-stack: 5
  elite-hunt-stacks: 5
  payout-per-stack: 0.10
  # Identify consumer: % chance per stack that a revealed rift surges one rarity tier
  rarity-upgrade-percent-per-stack: 2
  # Boss bar HUD (top of screen, MiniMessage format) — {stacks}/{max}/{dmg}/{payout} placeholders
  bossbar-title: "<red>Residual Glitch: <white>{stacks}/{max}</white> <dark_gray>(<gray>+{dmg}% dmg taken, +{payout}% payout</gray>)</dark_gray>"
  # Mirror stacks onto the vanilla XP bar (level = stacks, fill = 8/8).
  # Off by default — the boss bar is the HUD; the XP bar is free for other uses.
  show-xp-bar: false

# Elite hunt consumer: once a player reaches elite-hunt-stacks, this mob spawns
# near them immediately, then again every spawn-interval-minutes while they
# stay at that stack level. Spawned via console "mm spawn" (MythicMobs).
elite-hunt:
  mob: "GlitchSentinel"
  spawn-interval-minutes: 10
  spawn-radius: 12
  announce: true
  message: "<dark_red><bold>An elite hunts you.</bold></dark_red> <gray>Something powerful is closing in.</gray>"

# In-world loot containers (design GAME_DESIGN.md §3, ITEM_SYSTEM.md §9).
# Mark blocks in-world with: /glitchcontainers set <type>
# Opening rolls the rarity table into the block's inventory (or drops at the
# block if it has none), respects a per-block regen cooldown, consumes the
# required key, and applies the Residual Glitch loot-luck consumer
# (per-roll rarity surge chance + surge drop chance = lootLuckBonus%).
containers:
  enabled-worlds: [glitch_red, glitch_pve]
  # Extra container rolls for Specters with the Scavenge trait (GlitchClasses
  # keeps the specter_scavenge scoreboard tag in sync)
  scavenge-bonus-rolls: 1
  types:
    debris:
      display: "<gray>Debris Pile"
      material: BARREL
      key-id: ""
      key-material: ""
      key-name: ""
      regen-seconds: 300
      max-rolls: 2
      drops: { common: 60, uncommon: 25, nothing: 15 }
      materials: { rune_fragment: 40 }
      shards-min: 0
      shards-max: 0
    cache:
      display: "<green>Loot Cache"
      material: CHEST
      key-id: "cache_key"
      key-material: "TRIPWIRE_HOOK"
      key-name: "Cache Key"
      regen-seconds: 600
      max-rolls: 2
      drops: { uncommon: 40, rare: 30, common: 20, nothing: 10 }
      materials: { rune_fragment: 30, aether_shard: 15, rift_crystal: 5 }
      shards-min: 4
      shards-max: 10
    vault:
      display: "<blue>Vault"
      material: BLUE_SHULKER_BOX
      key-id: "vault_key"
      key-material: "TRIPWIRE_HOOK"
      key-name: "Vault Key"
      regen-seconds: 900
      max-rolls: 2
      drops: { rare: 28, epic: 42, legendary: 5, uncommon: 20, nothing: 5 }
      materials: { aether_shard: 20, rift_crystal: 15, void_essence: 8 }
      shards-min: 10
      shards-max: 30
    rift_vault:
      display: "<light_purple>Rift Vault"
      material: DECORATED_POT
      key-id: "rift_key"
      key-material: "TRIPWIRE_HOOK"
      key-name: "Rift Key"
      regen-seconds: 1800
      max-rolls: 3
      drops: { epic: 30, legendary: 50, rare: 20 }
      materials: { rift_crystal: 20, void_essence: 15, legendary_relic: 3 }
      shards-min: 25
      shards-max: 60
  messages:
    not-container: "<gray>That is not a Glitch container."
    disabled-world: "<red>Containers are dormant here."
    not-ready: "<red><container> is still glitching — <time>s left."
    need-key: "<red><container> is sealed. You need a <gold><key></gold>."
    emptied: "<gray>The <container> rustles and settles... nothing inside."
    looted: "<gold>You loot the <container>!"
    surge: "<light_purple>Residual Glitch surges — the container spits out extra loot!</light_purple>"
    shards: "<gold>+<amount> Shards</gold> <gray>cling to the loot.</gray>"

# Automatic loot scatter — RED WORLD only, sparse, on solid ground.
# Fires right after extraction ends (AutoExtractCycleEndEvent at t0+30m+5s from GlitchStash).
# Fixed-rate timer is disabled when GlitchStash is present (single 31m source of truth) —
# interval-minutes is fallback only if Stash is absent.
#
# Density 2026-08-24: increased per operator request "2/3 per 5-10 chunks" —
# previous 36 total (~1/430 chunks) was too sparse. New 145 total (~1/107 chunks)
# is ~4x denser, playable without TPS collapse (naive 2 per 5 chunks would be 6250).
# Config-driven — edit counts to retune without code change.
scatter:
  enabled: true
  enabled-worlds: [glitch_red]
  interval-minutes: 31
  clear-previous: true
  on-top-only: true
  border-radius: 1000
  # Center of the scatter square. The imported Odyssey 2k map's land sits at
  # [0..2000]² (offset +1000,+1000 from world origin), so the scatter targets it.
  center-x: 1000
  center-z: 1000
  chunks-per-container: 8
  max-attempts-per-container: 50
  persist-file: "scattered.json"
  counts:
    debris: 70
    cache: 40
    vault: 25
    rift_vault: 6
  messages:
    scatter-broadcast: "<gray>Glitch energy coalesces — <white>{total}</white> caches scattered across the Red World."
    broadcast-enabled: true
