name: GlitchItems
version: '${project.version}'
main: com.theglitch.glitchitems.GlitchItems
api-version: '1.21'
description: Item system for The Glitch — gear rolls, rifts, Resonance, Residual Glitch
softdepend:
  - VaultUnlocked
  - PlaceholderAPI

commands:
  identify:
    description: Identify an Unstable Rift into gear
    usage: /identify [force]
    permission: glitchitems.use
  glitchitems:
    description: Admin commands for GlitchItems
    usage: /glitchitems <give|glitch|reload>
    permission: glitchitems.admin
  glitchcontainers:
    description: Mark and manage in-world loot containers
    usage: /glitchcontainers <set <type>|clear|info|types|reload>
    permission: glitchitems.admin

permissions:
  glitchitems.use:
    description: Access item commands
    default: true
  glitchitems.admin:
    description: Admin item commands
    default: op
