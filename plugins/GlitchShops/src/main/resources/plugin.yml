name: GlitchShops
version: '${project.version}'
main: com.theglitch.glitchshops.GlitchShops
api-version: '1.21'
description: Merchant NPCs for The Glitch — buy/sell custom items for Glitch Shards
softdepend:
  - Oraxen
  - GlitchItems
  - FancyNpcs
  - Vault
  - VaultUnlocked
  - Coins
  - PlaceholderAPI

commands:
  shop:
    description: Open the Grand Bazaar
    usage: /shop [open <tab>|reload|restock]
    permission: glitchshops.use
  shopui:
    description: Internal shop dialog actions
    usage: /shopui <open|root|buy|buygear|sellmode> [args]

permissions:
  glitchshops.use:
    description: Access the bazaar
    default: true
  glitchshops.admin:
    description: Admin shop commands
    default: op
