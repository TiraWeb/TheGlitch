config-version: 1
# GlitchRaid — Raid lifecycle manager (ROADMAP 5.9.3)
# Timers, party assignment, post-raid summary screen, death recap, loot accounting.

raid:
  # Total raid duration in seconds (30 minutes default)
  duration-seconds: 1800
  # Delay in ticks before showing post-raid summary screen (40 ticks = 2 seconds)
  summary-delay-ticks: 40
  # Maximum party size for a raid
  party-max-size: 4
  # Loot payout multiplier (applied on raid end: final = lootValue * payout)
  payout-multiplier: 1.0

  # Join mode: how new entrants join an already-running extraction
  # - global-remaining (default): all players in glitch_red share ONE global session
  #   and see the remaining time of the running 30m extraction. Solo joiners are
  #   added to the global session (no fresh 30m). Used with the 31m auto-cycle
  #   (30m extraction + 1m scatter buffer). The scheduler calls startGlobalRaid().
  # - solo-new: each solo entrant starts a fresh 1800s session (legacy per-player timer)
  join-mode: "global-remaining"

  # World names — change if your hub extraction world is named differently
  hub-world: "hub"
  auto-start-world: "glitch_red"

messages:
  raid-started: "<green><bold>Raid started!</bold> <gray>Good luck — the Glitch awaits.</gray>"
  raid-auto-started: "<green><bold>Raid started!</bold> <gray>You entered the Glitch — 30:00 to extract!</gray>"
  raid-ended: "<red>Raid ended <gray>(<reason>)</gray> — returning to hub...</red>"
  raid-extracted: "<green><bold>Extracted!</bold> <gray>Loot secured — welcome back to the hub.</gray></green>"
  raid-time-left: "<aqua>Time left: <white><time></white></aqua>"
  not-in-raid: "<red>You are not in a raid.</red>"
  already-in-raid: "<red>You are already in a raid!</red>"
  raid-summary-title: "<gold><bold>Raid Summary</bold></gold>"
  death-recap: "<red>Death recap: <white>You died! <gray>(Death #<deaths> this raid)</gray></white></red>"
  party-member-died: "<red>Party member <white><player></white> died! <gray>(Deaths: <deaths>)</gray></red>"
  raid-status: "<gray>Time left: <white><time></white> <gray>| Loot: <gold><loot></gold> <gray>| Deaths: <red><deaths></red>"
  loot-added: "<gold>+<amount> loot value</gold>"
  raid-end-blocked: "<red>Raids end only by extracting or by an admin. Use the extraction beacons!</red>"
  raid-warn-60: "<red><bold>WARNING:</bold> <gray>60 seconds left — extract now or the Glitch will consume you!</gray></red>"
  raid-warn-30: "<red><bold>30 seconds left — get to an extraction beacon!</bold></red>"
  raid-warn-10: "<red><bold>10 seconds!</bold> <gray>The Glitch closes — extract or die!</gray></red>"
  raid-timeout-killed: "<dark_red><bold>The Glitch consumed you.</bold> <gray>You failed to extract — raid loot lost. Stash is safe.</gray></dark_red>"
  raid-cancelled-disconnect: "<red><bold>Raid cancelled.</bold> <gray>You disconnected in the Red Zone — raid loot was lost. Waking up back in the Hub.</gray></red>"
  raid-interrupted: "<yellow><bold>Raid interrupted.</bold> <gray>The raid ended while you were away — waking up back in the Hub.</gray></yellow>"
  party-invite-sent: "<green>Invited <white><player></white> to your raid party. <gray>(<cur>/<max>)</gray></green>"
  party-invite-received: "<green><white><player></white> invited you to a raid party! <yellow>Use /raid accept</yellow> to join. <gray>(30s)</gray></green>"
  party-joined: "<green>Joined <white><leader></white>'s raid party! <gray>(<cur>/<max>)</gray></green>"
  party-left: "<yellow>Left the raid party.</yellow>"
  party-kicked: "<red>You were kicked from the raid party.</red>"
  party-disbanded: "<yellow>Raid party disbanded.</yellow>"
  party-full: "<red>Party full (<cur>/<max>).</red>"
  party-not-leader: "<red>Only party leader can do that.</red>"
  party-no-invite: "<red>No pending raid invite.</red>"
  party-already-in-party: "<red>Already in a party.</red>"
