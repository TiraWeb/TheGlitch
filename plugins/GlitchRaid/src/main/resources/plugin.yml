name: GlitchRaid
version: '${project.version}'
main: com.theglitch.glitchraid.GlitchRaid
api-version: '1.21'
description: Raid lifecycle manager for The Glitch — timers, party assignment, post-raid summary, death recap, loot accounting
depend: []
softdepend:
  - VaultUnlocked
  - PlaceholderAPI
  - GlitchShops
  - GlitchItems
  - GlitchStash
  - VelKoth
  - Coins
  - MythicDungeons
commands:
  raid:
    description: Raid lifecycle commands — start, end, status, help
    usage: /raid <start|end|status|help>
    permission: glitchraid.raid
  raidadmin:
    description: Admin commands for GlitchRaid — reload, list, end
    usage: /raidadmin <reload|list|end <player>>
    permission: glitchraid.admin
  redportal:
    description: Mark and place the hub-to-Red walk-in portal (pos1, pos2, set [floor], remove, info)
    usage: /redportal <pos1|pos2|set [floor]|remove|info>
    permission: glitchraid.admin
  redzone:
    description: Opens the Red Zone world picker GUI
    usage: /redzone
    permission: glitchraid.raid
  abandon:
    description: Leave the current raid (counts as dying, MIA) or dungeon (no rewards) and go to the hub
    usage: /abandon  (or /leave inside a raid or dungeon)
    aliases: [leaveraid, quitraid]
    permission: glitchraid.raid
  rank:
    description: Raider Rank — your tier, the ladder, recent RR and the top 10
    usage: /rank [top|<player>]
    aliases: [raiderrank, rr]
    permission: glitchraid.raid
  dungeons:
    description: Opens the boss dungeon picker (entry costs a dungeon key)
    usage: /dungeons
    aliases: [dungeonmenu]
    permission: glitchraid.raid
permissions:
  glitchraid.raid:
    description: Use raid commands
    default: true
  glitchraid.admin:
    description: Admin raid commands
    default: op
  glitchraid.bypass.exit:
    description: Leave a red world mid-raid without extracting / use ender chests there. Not granted to ops by default — admins leave with /raidadmin end <player>.
    default: false
