# Gear rarity weights (GlitchItems gear). Armor pieces roll per slot with armor-chance.
gear-tiers:
  common: 45
  uncommon: 30
  rare: 17
  epic: 7
  legendary: 1
armor-chance: 0.7
# Share of rogues that fight with a bow/crossbow instead of a blade
ranged-chance: 0.25

combat:
  health: 20.0
  range: 24.0          # how far they notice targets
  chase-range: 40.0
  attack-rate-ticks: 14
  # Lower = better aim (Sentinel accuracy spread) per rarity tier
  accuracy:
    common: 2.5
    uncommon: 2.0
    rare: 1.4
    epic: 0.9
    legendary: 0.5
  # Below this share of max health a rogue breaks off and runs for a few seconds
  flee-health: 0.3
  flee-seconds: 7

loot:
  # Crates a rogue loots before heading for extraction
  max-crates: 4
  crate-search-radius: 80
  # Head for extraction when the raid timer has less than this left (seconds)
  extract-when-remaining: 240

drops:
  # Each worn/held piece drops with this chance; the looted bag always drops
  gear-chance: 0.35

# Kill bounty / Raider Rank credit for killing a rogue live in GlitchRaid's config
# (rogue-kill-bounty, rank.extract.per-rogue-kill).
