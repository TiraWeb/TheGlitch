# GlitchBots — Rogue Raiders (AI raider bots)
#
# Rogues are an openly AI faction: they look and fight like raiders, loot crates and
# head for extraction, but they never appear in the tab list or the server's player
# count and never pretend to be human. Their names always carry the "Rogue" label.

config-version: 1
enabled: true

# Red worlds that get rogues
worlds:
  - glitch_red
  - glitch_red_eleria
  - glitch_red_horizons

# Each world is filled up to this many raiders: bots = target - real players (never below 0).
# Rogues only exist while at least one real player is in the world.
target-per-world: 10

# New rogues appear out of sight, this many blocks from a random real player in the world
# (entities only tick within simulation-distance of a player, so keep max under ~110).
spawn-ring:
  min: 40
  max: 96
# ...and never closer than this to ANY real player
min-player-distance: 24
max-spawn-per-tick: 1
# Director tick (seconds)
tick-seconds: 5
# Seconds a world must be empty of real players before its rogues are removed
despawn-grace-seconds: 30

# Plain text only (no color codes — Minecraft rejects them in player-entity names); the
# name is colored through the NPC's scoreboard team instead.
name-format: "Rogue <name>"
name-color: RED
names:
  - Vex
  - Kael
  - Riven
  - Sable
  - Dusk
  - Nyx
  - Corvo
  - Hex
