# Gear rarity weights (GlitchItems gear). Armor pieces roll per slot with armor-chance.
gear-tiers:
  common: 45
  uncommon: 30
  rare: 17
  epic: 7
  legendary: 1
armor-chance: 0.7
# Share of rogues that fight with a bow/crossbow instead of a blade
ranged-chance: 0.25

combat:
  health: 20.0
  range: 24.0          # how far they notice targets
  chase-range: 40.0
  attack-rate-ticks: 14
  # Lower = better aim (Sentinel accuracy spread) per rarity tier
  accuracy:
    common: 2.5
    uncommon: 2.0
    rare: 1.4
    epic: 0.9
    legendary: 0.5
  # Below this share of max health a rogue breaks off and runs for a few seconds
  flee-health: 0.3
  flee-seconds: 7

loot:
  # Crates a rogue loots before heading for extraction
  max-crates: 4
  crate-search-radius: 80
  # Head for extraction when the raid timer has less than this left (seconds)
  extract-when-remaining: 240

# Rogue trash talk: one shouted line when a rogue first spots a real raider, heard within
# hear-radius. Written by Gemini when a key is present, otherwise a fallback line.
# API key: put it in plugins/GlitchBots/gemini.key on the server (one line, nothing else) —
# never in this file in the repo. GEMINI_API_KEY env var or chat.api-key also work.
chat:
  enabled: true
  model: gemini-3.5-flash-lite   # 2.5 Flash-Lite is closed to new API users (HTTP 404)
  api-key: ""
  hear-radius: 40
  bot-cooldown-seconds: 60          # a rogue shouts at most once per minute
  same-player-cooldown-seconds: 300 # and at the same raider at most every 5 minutes
  max-ai-per-minute: 8              # server-wide Gemini cap; free tier 429s around ~15/min (then 60 s backoff)
  max-words: 18
  system-prompt: >-
    You are <name>, a Rogue Raider: an AI bandit bot in The Glitch, a Minecraft extraction server
    where reality keeps breaking. Your vibe: <quirk>.
    You just spotted a player. Shout ONE line, max <max_words> words, like a deranged online gamer
    in voice chat: unhinged, deadpan, specific, genuinely funny. Think British banter, absurd
    non-sequiturs, oddly specific threats, roasting their gear, aim, skin or life choices.
    Swearing is encouraged: fuck, shit, cunt, twat, wanker, dickhead, prick are all fine, used as banter.
    NEVER insult anyone for sexuality, race, gender, religion or disability, no slurs, nothing
    sexual (no nonce or paedo jokes), no real-world politics or real people, nothing about
    self-harm or suicide. Never claim to be human.
    Avoid cringe: no pirate or medieval talk, no puns, no "prepare to", no "taste my", no "shiny",
    no "loot goblin", no exclamation spam, no rhymes, no narrating your own personality.
    Vary it: do NOT start with "oi", do NOT use "you absolute", do NOT open with "nice <item>".
    Use their name at most once, often not at all. Mix threats, weird confessions, fake friendliness
    and random observations.
    Examples of the right tone (do not copy them):
    | oi you dozy prick, put the sword down before you hurt yourself
    | mate I've been in this wall for six days and you're the first thing I've seen
    | nice armor, shame you walk like a wardrobe falling down stairs
    | come here you absolute cunt, I just want to talk. and stab. mostly stab
    | I can smell your inventory from here and it smells like poverty
    | right so I'm going to need those boots, the pickaxe and honestly your whole family tree
    | stand still, I've only got one arrow and it's emotionally important to me
    | the glitch told me to kill you but I'd have done it for free tbh
    Output only the line, no quotes.
  quirks:
    - has been stuck in the glitch so long he thinks it's 2011
    - unnervingly calm, treats murder like customer service
    - keeps bringing up his ex at the worst moments
    - convinced you owe him 40 quid
    - a tired dad who just wants to finish this raid and go home
    - rates every player's outfit out of ten, harshly
    - a sweaty try-hard who takes this way too seriously
    - thinks the glitch is talking to him through the grass
    - absolutely skint and very bitter about it
    - narrates everything like a nature documentary, badly
    - genuinely thinks he is the protagonist
    - extremely polite until the very last word
    - a smug speedrunner who thinks you're wasting his time
    - hasn't slept since the last map wipe
    - treats every fight like a job interview
    - only here because his mate dared him
  # A generated line containing a word STARTING with any of these is replaced by a fallback line
  blocked-words:
    - gay
    - fag
    - homo
    - lesbian
    - trann
    - retard
    - autis
    - spastic
    - spaz
    - parkinson
    - cripple
    - down syndrome
    - downie
    - schizo
    - nonce
    - paedo
    - pedo
    - rape
    - nigg
    - kys
    - kill yourself
    - suicide
    - hitler
    - nazi
    - jews
    - jewish
    - muslim
    - islam
    - christian
  fallback-lines:
    - "right <player>, I'm going to need your boots, your sword and honestly your whole family tree"
    - "stand still, I've only got one arrow and it's emotionally important to me"
    - "the glitch told me to kill you but I'd have done it for free tbh"
    - "mate I've been stuck in this wall for six days and you're the first thing I've seen"
    - "I can smell your inventory from here and it smells like poverty"
    - "come here you little shit, I just want to talk. and stab. mostly stab"
    - "<player> you walk like a wardrobe falling down the stairs"
    - "no offence but your armour looks like it was crafted during a power cut"
    - "don't run, it makes it weird for both of us"
    - "be honest <player>, did you pick that gear in the dark"

drops:
  # Each worn/held piece drops with this chance; the looted bag always drops
  gear-chance: 0.35

# Kill bounty / Raider Rank credit for killing a rogue live in GlitchRaid's config
# (rogue-kill-bounty, rank.extract.per-rogue-kill).
