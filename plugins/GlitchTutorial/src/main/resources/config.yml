# GlitchTutorial — first-join tutorial ("First Raid")
#
# Flow: intro → pick a class → loot 3 crates → kill 3 Glitch mobs → beat a training rogue →
# extract → hub tour → first dungeon → finish (+reward). Tutorial items are tagged and always
# taken back; whatever the player had before is given back at the end.
#
# Points are set with /tutorial admin autolayout (picks spots in the tutorial world) and
# fine-tuned in-game with /tutorial admin setpoint <name> (stand on the spot).

config-version: 1
enabled: true
# Template world (built by scripts/setup-tutorial.sh). Players never play in it: each one gets a
# private copy named <world>_<n> (like dungeon instances) that is unloaded and deleted as soon as
# they leave it — finished, skipped, logged out or /spawn. Edit points/crates in the template.
world: tutorial
# Most private tutorial worlds at once (each is ~26 MB on disk while it runs)
max-instances: 30
# Brand-new players (never joined before) start it automatically
auto-start: true

reward:
  shards: 500

# Steps 1-6 happen at these points in the tutorial world (world: <world> above).
points:
  spawn: {x: -72.5, y: 70.0, z: -88.5, yaw: 0}
  echo: {x: -70.5, y: 70.0, z: -86.5, yaw: 180}
  crate1: {x: -72.5, y: 70.0, z: -70.5}
  crate2: {x: -66.5, y: 70.0, z: -60.5}
  crate3: {x: -76.5, y: 70.0, z: -52.5}
  mobs: {x: -72.5, y: 70.0, z: -36.5}
  rogue: {x: -72.5, y: 70.0, z: -16.5}
  extract: {x: -72.5, y: 70.0, z: 4.5}

# Hub tour (step 7): walk to each stop in order
hub-tour:
  # Walking order from the hub spawn (147.8, 23). A stop takes "line" or "lines"; "command" is run
  # by the player after Echo finishes (used to open the hideout menu). Where a stop has both an
  # NPC and a wall panel, Echo says either works — the panels are experimental.
  - name: Class Master
    world: hub
    x: 174.57
    y: -36.0
    z: -59.36
    lines:
      - "The <gold>Class Master</gold>. Switch class any time — every class keeps its own level, so switching back costs nothing."
      - "The wall next to him does the same: click a class to see its abilities. The wall is experimental — if it acts up, talk to the Class Master or type <yellow>/class</yellow>."
  - name: Stash Keeper
    world: hub
    x: 96.44
    y: -46.0
    z: -6.54
    line: "This is your <green>stash</green>. Everything you extract lands here — it's the only place loot is safe. Right-click the Stash Keeper or type <yellow>/stash</yellow>."
  - name: Red Zone Portal
    world: hub
    x: 96.0
    y: -46.0
    z: 3.0
    line: "The <red>Red Zone portal</red>. Walk in and pick one of three maps, each with its own raid timer. Your party leader brings the party."
  - name: Dungeon Master
    world: hub
    x: 96.8
    y: -46.0
    z: 13.71
    line: "The <light_purple>Dungeon Master</light_purple> runs the boss dungeons — private runs for you and your party, one key each. You'll do your first one at the end of this tour (<yellow>/dungeons</yellow> works too)."
  - name: Grand Bazaar
    world: hub
    x: 102.16
    y: -36.0
    z: 62.59
    lines:
      - "The <gold>Grand Bazaar</gold>. Sell loot for Shards, buy gear, keys and potions."
      - "Talk to the merchant, or browse the wall behind with its arrows. The wall is experimental — the merchant (or <yellow>/shop</yellow>) always works."
  - name: Insurance
    world: hub
    x: 56.62
    y: -36.0
    z: 95.01
    line: "<yellow>Insurance</yellow>: pay a little before a raid and that gear comes back if you die. Use the wall here or <yellow>/insurance</yellow> — the wall is experimental."
  - name: Hideout
    world: hub
    x: 35.29
    y: -36.0
    z: 93.31
    lines:
      - "Your <aqua>Hideout</aqua>. Every station levels up with Shards and gives you something permanent."
      - "<gold>Workbench</gold>: craft gadgets, the Secure Pouch and gear from blueprints you find in raids. The Recycler next to it turns junk into parts."
      - "<green>Med Station</green> heals you, <dark_purple>Stash</dark_purple> and <blue>Armory</blue> add storage, <red>Skill Trainer</red> boosts your class, <light_purple>Arcane Core</light_purple> and <aqua>Intel Center</aqua> unlock higher tiers."
      - "On this wall: left-click a station to use it, right-click to upgrade. It's experimental — <yellow>/hideout</yellow> opens the same menu. Here, have a look."
    command: hideout

dungeon:
  # MythicDungeons map id of the first dungeon (Goblin Hollow)
  id: small
  key-item: dungeon_key_t1

# Lent for the tutorial only (tagged, taken back at the end)
loadout:
  gear:
    - BLADE:LEGENDARY
    - HELMET:EPIC
    - CHESTPLATE:EPIC
    - LEGGINGS:EPIC
    - BOOTS:EPIC
  items:
    - healing_potion:6
    - ward_salve:3
    - minecraft:golden_apple:4
    - minecraft:cooked_beef:16

# "Tutorial blessing": effects kept on while the tutorial runs (refreshed every few seconds,
# they wear off by themselves ~15 s after it ends). EFFECT:amplifier (0 = level I).
blessing:
  - STRENGTH:1
  - RESISTANCE:1
  - REGENERATION:0

# Combat buff while the tutorial is active (multiplies the final damage, after gear):
# lent gear alone can't carry a newcomer through Goblin Hollow (boss: 900 HP, 8-32 per hit).
combat:
  tutorial-world:
    damage-dealt: 1.5
    damage-taken: 0.6
  dungeon:
    damage-dealt: 3.0
    damage-taken: 0.35
    message: "Echo's blessing follows you in here: you hit <green>3× harder</green> and take <green>far less damage</green> — for this first run only."

# What each tutorial crate gives (tagged too) — "nexo id:amount" or "minecraft:material:amount"
crate-loot:
  crate1: [scrap_plating:2, frayed_wiring:1]
  crate2: [rift_crystal:1, polymer_goo:2]
  crate3: [aether_tonic:1, circuit_core:1]
rogue-drop: [unstable_rift_uncommon:1, coolant_cell:2]

mobs:
  type: CorruptedCrawler
  count: 3
rogue:
  # /bots tutorial spawns a weak rogue that only targets this player
  enabled: true
extract-seconds: 5

# Dialogue — MiniMessage. <player> = name. Lines are sent a few seconds apart.
guide-name: "<aqua><bold>Echo</bold></aqua>"
line-delay-ticks: 60
dialogue:
  intro:
    - "Hey, <player>. You're awake. Good — the Glitch didn't eat you on the way in."
    - "This place is an <red>extraction zone</red>: you go in, grab what you can, and get OUT alive."
    - "Die in there and everything you carried stays behind. Extract and it's yours forever."
    - "I'll lend you some decent gear for a practice run. Let's go."
  class:
    - "First, pick a <gold>class</gold>. It decides your abilities — you can switch later."
  class-done:
    - "Nice. Here's some gear for the practice run — it goes back to me at the end, so don't get attached."
  crates:
    - "See those <gold>loot crates</gold>? Open all three. In real raids they refill on a timer, and other raiders want them too."
  crates-done:
    - "Everything you loot has value. The more you carry out, the more you earn — and the more you lose if you die."
  mobs:
    - "Glitch mobs incoming. Kill all three — swing, block, use your class ability."
  mobs-done:
    - "Not bad. In the Red Zone they hit harder and come in packs."
  rogue:
    - "Careful — a <red>Rogue Raider</red>. They loot, fight and talk a LOT of trash. Shut him up."
  rogue-done:
    - "Rogues drop what they carried. Grab it — that's free loot."
  extract:
    - "Now the important part: <green>extraction</green>. Stand in the beam until it finishes."
  extract-done:
    - "<green>Extracted!</green> In a real raid that loot would go straight to your stash."
    - "The raid clock is 30 minutes. If it hits zero and you're still inside, the Glitch takes you. Typing <yellow>/leave</yellow> counts as dying."
    - "Let me show you around the hub."
  hub:
    - "Follow the arrow on your screen — I'll explain each stop."
  dungeon:
    - "Last thing: a <light_purple>boss dungeon</light_purple>. Here's an Iron Dungeon Key — open <yellow>/dungeons</yellow> and pick <green>Goblin Hollow</green>."
    - "Dungeons are private, keep your inventory, and the boss drops proper loot. Go get him."
  dungeon-retry:
    - "Didn't make it? Here's another key — try again, or <yellow>/tutorial skip</yellow> if you've had enough."
  done:
    - "That's it, <player>. You know the loop: raid, loot, extract, repeat — and don't trust anyone."
    - "Here's <aqua><reward> Shards</aqua> to get you started. See you in the Glitch."

# HUD objective lines (shown on the top-left card)
objectives:
  intro: "Listen to Echo"
  class: "Pick a class"
  crates: "Open the loot crates (<n>/3)"
  mobs: "Kill the Glitch mobs (<n>/<max>)"
  rogue: "Defeat the Rogue Raider"
  extract: "Extract — stand in the beam"
  hub: "Visit: <stop> (<n>/<max>)"
  dungeon: "Clear Goblin Hollow (/dungeons)"
